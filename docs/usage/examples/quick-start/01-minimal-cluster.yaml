# Minimal WazuhCluster - Quick Start Example
#
# Single-node deployment for development, testing and learning the operator.
# Fits on a 2 vCPU / 4GB node (minikube, kind, k3s) — NOT for production
# (single indexer = no quorum, no HA, self-signed TLS).
# Footprint: ~0.6 vCPU / ~2.75GiB requests.
#
# Usage:
#   kubectl create namespace wazuh
#   kubectl apply -f 01-minimal-cluster.yaml
#
apiVersion: resources.wazuh.com/v1
kind: WazuhCluster
metadata:
  name: wazuh-quickstart
  namespace: wazuh
  labels:
    environment: development
spec:
  # Wazuh version - see https://documentation.wazuh.com for available versions
  version: "4.9.0"

  # Uses the cluster's default StorageClass. Uncomment to pin one explicitly:
  # storageClassName: "standard"

  # Indexer configuration (OpenSearch-based)
  indexer:
    replicas: 1
    storageSize: 10Gi
    javaOpts: "-Xms1g -Xmx1g -Dlog4j2.formatMsgNoLookups=true"
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: 1
        memory: 2Gi
    service:
      type: ClusterIP

  # Manager configuration
  manager:
    master:
      storageSize: 5Gi
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      service:
        type: ClusterIP
    workers:
      replicas: 0  # No workers for minimal setup

  # Dashboard configuration
  dashboard:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
    service:
      type: NodePort  # Easy access on minikube/kind

  # TLS enabled by default
  tls:
    enabled: true
    certConfig:
      organization: "Wazuh Quick Start"
      country: "US"
