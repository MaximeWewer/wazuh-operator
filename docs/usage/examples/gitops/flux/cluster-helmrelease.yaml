# Flux HelmRelease for Wazuh Cluster
#
# This deploys a Wazuh cluster using Flux.
#
# Prerequisites:
#   - Wazuh Operator installed (see operator-helmrelease.yaml)
#   - HelmRepository or GitRepository created
#
# Usage:
#   kubectl apply -f cluster-helmrelease.yaml
#
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wazuh-cluster-prod
  namespace: flux-system
spec:
  interval: 30m
  releaseName: wazuh-cluster
  targetNamespace: wazuh

  # Dependency on operator
  dependsOn:
    - name: wazuh-operator
      namespace: flux-system

  chart:
    spec:
      chart: charts/wazuh-cluster
      sourceRef:
        kind: GitRepository
        name: wazuh-operator
        namespace: flux-system
      interval: 5m

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    namespace: wazuh
    createNamespace: true

    # Sizing profile
    sizing:
      profile: M
      storageClassName: ""

    # Cluster configuration
    cluster:
      name: wazuh-prod
      spec:
        version: "4.9.0"
        tls:
          enabled: true
          hotReload:
            enabled: true

    # Network policies
    networkPolicy:
      enabled: true
      operatorNamespace: wazuh-system

  # Values from Secrets (recommended for credentials)
  valuesFrom:
    - kind: Secret
      name: wazuh-credentials
      valuesKey: values.yaml
      optional: true

  # Drift detection
  driftDetection:
    mode: enabled
---
