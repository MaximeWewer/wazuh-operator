# Flux Kustomization for organizing Wazuh GitOps resources
#
# This is used with Flux's Kustomization controller to deploy
# all Wazuh resources in order.
#
# Usage:
#   Create a Flux Kustomization pointing to this directory:
#
#   apiVersion: kustomize.toolkit.fluxcd.io/v1
#   kind: Kustomization
#   metadata:
#     name: wazuh-infrastructure
#     namespace: flux-system
#   spec:
#     interval: 10m
#     path: ./examples/gitops/flux
#     prune: true
#     sourceRef:
#       kind: GitRepository
#       name: wazuh-operator
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Source for Helm charts
  - git-repository.yaml
  # Or use OCI:
  # - helm-repository.yaml

  # Operator deployment (deployed first)
  - operator-helmrelease.yaml

  # Cluster deployment (depends on operator)
  - cluster-helmrelease.yaml
