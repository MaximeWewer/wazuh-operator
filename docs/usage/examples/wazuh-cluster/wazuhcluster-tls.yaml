# WazuhCluster with advanced TLS/Certificate configuration examples
apiVersion: resources.wazuh.com/v1
kind: WazuhCluster
metadata:
  name: wazuh-tls-custom
  namespace: wazuh
spec:
  version: "4.9.2"

  # ==========================================================================
  # TLS Configuration - Auto-generated certificates
  # ==========================================================================
  tls:
    enabled: true

    # Certificate generation configuration
    certConfig:
      # X.509 Subject fields
      country: "FR"
      state: "Alsace"
      locality: "Strasbourg"
      organization: "My Company Inc."
      organizationalUnit: "Security Operations"

      # Per-component certificate validity as duration string
      # Format: "<value><unit>" where unit is d (days), h (hours), or m (minutes)
      # Node certs can be short since hot reload allows seamless renewal
      indexerValidity: "90d"
      indexerRenewalThreshold: "30d"
      dashboardValidity: "90d"
      dashboardRenewalThreshold: "30d"
      filebeatValidity: "90d"
      filebeatRenewalThreshold: "30d"
      adminValidity: "365d"
      adminRenewalThreshold: "30d"

      # CA certificate validity (default: 3650d / 10 years)
      # Should be longer since CA renewal requires pod restart
      caValidity: "730d"

      # CA renewal threshold
      caRenewalThreshold: "90d"

    # Hot reload configuration (Wazuh >= 4.9.0)
    # Allows certificate renewal without pod restarts
    hotReload:
      enabled: true
      # Force API reload for older OpenSearch versions
      forceAPIReload: false

  manager:
    master:
      storageSize: "10Gi"
    workers:
      replicas: 0

  indexer:
    replicas: 1
    storageSize: "20Gi"

  dashboard:
    replicas: 1
---
