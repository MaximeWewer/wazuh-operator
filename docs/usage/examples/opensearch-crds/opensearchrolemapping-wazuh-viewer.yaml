# OpenSearchRoleMapping - binds users/backend-roles to the wazuh-viewer role.
# metadata.name must match the role name being mapped.
apiVersion: resources.wazuh.com/v1
kind: OpenSearchRoleMapping
metadata:
  name: wazuh-viewer
  namespace: wazuh
spec:
  clusterRefs:
    - name: wazuh-test
      namespace: wazuh

  # Internal users granted read-only access
  users:
    - viewer

  # Backend roles (from LDAP/AD/SSO) granted read-only access
  backendRoles:
    - wazuh-viewers

  description: "Maps viewers to the wazuh-viewer role"
