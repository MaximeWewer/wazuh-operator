# OpenSearchSnapshotRepository example for MinIO (S3-compatible)
# This creates a snapshot repository in MinIO for storing OpenSearch snapshots
#
# PREREQUISITE: The repository-s3 plugin must be installed in OpenSearch nodes.
# The wazuh-indexer image requires several workarounds for the plugin installer.
#
# Add the following to your WazuhCluster spec:
#
#   indexer:
#     # Required: allow insecure settings for S3 credential passthrough
#     javaOpts: "-Xms512m -Xmx512m -Dopensearch.allow_insecure_settings=true"
#     extraInitContainers:
#     - name: install-repository-s3
#       image: wazuh/wazuh-indexer:4.14.1  # Must match your Wazuh version
#       securityContext:
#         runAsUser: 0  # Required to create /etc/sysconfig
#       env:
#       - name: OPENSEARCH_PATH_CONF
#         value: /usr/share/wazuh-indexer/config
#       command:
#       - sh
#       - -c
#       - |
#         mkdir -p /etc/sysconfig
#         touch /etc/sysconfig/wazuh-indexer
#         /usr/share/wazuh-indexer/bin/opensearch-plugin install --batch repository-s3
#         cp -r /usr/share/wazuh-indexer/plugins/repository-s3/* /mnt/plugins/
#       volumeMounts:
#       - name: s3-plugin
#         mountPath: /mnt/plugins
#     extraVolumes:
#     - name: s3-plugin
#       emptyDir: {}
#     extraVolumeMounts:
#     - name: s3-plugin
#       mountPath: /usr/share/wazuh-indexer/plugins/repository-s3
#
# Why these settings:
#   - runAsUser: 0 -> wazuh-indexer expects /etc/sysconfig/wazuh-indexer to exist
#   - OPENSEARCH_PATH_CONF -> plugin installer needs to find the config directory
#   - allow_insecure_settings=true -> required to pass S3 credentials via repository API
#
# See: https://docs.opensearch.org/latest/tuning-your-cluster/availability-and-recovery/snapshots/snapshot-restore/#amazon-s3
#
apiVersion: resources.wazuh.com/v1
kind: OpenSearchSnapshotRepository
metadata:
  name: minio-backups
  namespace: wazuh
spec:
  clusterRef:
    name: wazuh-cluster
  type: s3
  settings:
    bucket: wazuh-snapshots
    basePath: opensearch
    # MinIO endpoint (replace with your MinIO service)
    endpoint: http://minio.storage.svc.cluster.local:9000
    # Required for MinIO - use path-style access instead of virtual-hosted-style
    pathStyleAccess: true
    # Required - AWS SDK needs a region even for MinIO
    region: us-east-1
    compress: true
    # Credentials from Kubernetes Secret
    credentialsSecret:
      name: minio-credentials
      accessKeyKey: access-key
      secretKeyKey: secret-key
  # Verify repository after creation
  verify: true
---
# Secret containing MinIO credentials
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: wazuh
type: Opaque
stringData:
  access-key: minioadmin
  secret-key: minioadmin
