---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: wazuhbackups.resources.wazuh.com
spec:
  group: resources.wazuh.com
  names:
    kind: WazuhBackup
    listKind: WazuhBackupList
    plural: wazuhbackups
    shortNames:
    - wbak
    singular: wazuhbackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastBackup.time
      name: Last Backup
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: WazuhBackup is the Schema for scheduling Wazuh Manager data backups
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WazuhBackupSpec defines the desired state of WazuhBackup
            properties:
              backupTimeout:
                default: 30m
                description: BackupTimeout is the maximum duration for a backup operation
                type: string
              clusterRef:
                description: ClusterRef references the WazuhCluster to backup
                properties:
                  name:
                    description: Name of the WazuhCluster resource
                    type: string
                  namespace:
                    description: |-
                      Namespace of the WazuhCluster resource
                      If empty, assumes the same namespace as the referencing resource
                    type: string
                required:
                - name
                type: object
              components:
                description: Components defines what Wazuh Manager data to backup
                properties:
                  agentDatabase:
                    default: true
                    description: |-
                      AgentDatabase backs up /var/ossec/queue/db/ (agent databases)
                      Contains agent state information
                    type: boolean
                  agentKeys:
                    default: true
                    description: |-
                      AgentKeys backs up /var/ossec/etc/client.keys (agent registrations)
                      Critical for agent reconnection after restore
                    type: boolean
                  alertLogs:
                    default: false
                    description: |-
                      AlertLogs backs up /var/ossec/logs/alerts/
                      Can be large - consider using OpenSearch snapshots instead
                    type: boolean
                  customPaths:
                    description: |-
                      CustomPaths allows specifying additional paths to backup
                      Paths must be within /var/ossec/
                    items:
                      type: string
                    type: array
                  fimDatabase:
                    default: true
                    description: |-
                      FIMDatabase backs up /var/ossec/queue/fim/db/ (File Integrity Monitoring)
                      Contains FIM state and baselines
                    type: boolean
                  integrations:
                    default: false
                    description: |-
                      Integrations backs up /var/ossec/integrations/
                      Contains integration scripts
                    type: boolean
                type: object
              image:
                description: |-
                  Image specifies a custom backup container image
                  If not set, uses a default image with mc (MinIO Client), kubectl and tar
                properties:
                  pullPolicy:
                    description: PullPolicy is the image pull policy
                    type: string
                  repository:
                    description: Repository is the image repository
                    type: string
                  tag:
                    description: Tag is the image tag
                    type: string
                type: object
              resources:
                description: Resources for the backup Job/CronJob container
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              retention:
                description: Retention defines backup retention policy
                properties:
                  maxAge:
                    description: |-
                      MaxAge is the maximum age of backups to retain
                      Format: number + unit (d=days, w=weeks, m=months)
                      Example: "30d" for 30 days
                    type: string
                  maxBackups:
                    default: 14
                    description: |-
                      MaxBackups is the maximum number of backups to retain
                      Oldest backups are deleted when this limit is exceeded
                    format: int32
                    type: integer
                type: object
              schedule:
                description: |-
                  Schedule is a cron expression for scheduled backups
                  If empty, a one-shot backup Job is created instead of CronJob
                  Example: "0 2 * * *" for daily at 2 AM
                type: string
              serviceAccount:
                description: |-
                  ServiceAccount configuration for backup jobs
                  Supports cloud identity integrations (GKE Workload Identity, AWS IRSA, Azure Workload Identity)
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations on the ServiceAccount (e.g., iam.gke.io/gcp-service-account,
                      eks.amazonaws.com/role-arn)
                    type: object
                  create:
                    default: false
                    description: |-
                      Create: if true, the operator creates and manages the ServiceAccount.
                      If false, only sets ServiceAccountName on PodSpec (SA must already exist).
                    type: boolean
                  labels:
                    additionalProperties:
                      type: string
                    description: 'Labels on the ServiceAccount (e.g., azure.workload.identity/use:
                      "true")'
                    type: object
                  name:
                    description: Name is the ServiceAccount name. Auto-generated as
                      "{cluster}-{component}" if empty and Create=true.
                    type: string
                type: object
              storage:
                description: Storage defines where backups are stored
                properties:
                  azure:
                    description: Azure contains Azure-specific backup configuration
                    properties:
                      accountName:
                        description: AccountName is the Azure Storage account name
                        type: string
                      container:
                        description: Container is the Azure Blob Storage container
                          name (overrides Bucket)
                        type: string
                      endpointSuffix:
                        description: EndpointSuffix is the Azure endpoint suffix for
                          sovereign clouds
                        type: string
                    type: object
                  bucket:
                    description: Bucket is the bucket or container name (S3, GCS,
                      Azure)
                    type: string
                  credentialsSecret:
                    description: |-
                      CredentialsSecret references the Secret containing storage credentials
                      Optional for GCS Workload Identity or HDFS simple auth
                    properties:
                      accessKeyKey:
                        default: access-key
                        description: AccessKeyKey is the key in the Secret for the
                          access key ID
                        type: string
                      name:
                        description: Name of the Secret containing credentials
                        type: string
                      secretKeyKey:
                        default: secret-key
                        description: SecretKeyKey is the key in the Secret for the
                          secret access key
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: Endpoint is a custom S3 endpoint (for MinIO)
                    type: string
                  forcePathStyle:
                    description: ForcePathStyle enables path-style S3 access (required
                      for MinIO)
                    type: boolean
                  gcs:
                    description: GCS contains GCS-specific backup configuration
                    properties:
                      project:
                        description: Project is the GCP project ID
                        type: string
                    type: object
                  hdfs:
                    description: HDFS contains HDFS-specific backup configuration
                    properties:
                      path:
                        description: Path is the HDFS directory path for backups
                        type: string
                      uri:
                        description: |-
                          URI is the HDFS namenode WebHDFS URI
                          Example: "http://namenode:9870/webhdfs/v1"
                        type: string
                    required:
                    - path
                    - uri
                    type: object
                  prefix:
                    default: '{{ .ClusterName }}/{{ .Namespace }}'
                    description: |-
                      Prefix is the path prefix within the bucket
                      Supports Go templates: {{ .ClusterName }}, {{ .Namespace }}, {{ .Date }}
                    type: string
                  region:
                    description: Region is the AWS region (S3 only)
                    type: string
                  type:
                    description: Type is the storage backend type
                    enum:
                    - s3
                    - gcs
                    - azure
                    - hdfs
                    type: string
                required:
                - type
                type: object
              suspend:
                default: false
                description: |-
                  Suspend pauses scheduled backups when true
                  Only applies when Schedule is set
                type: boolean
            required:
            - clusterRef
            - components
            - storage
            type: object
          status:
            description: WazuhBackupStatus defines the observed state of WazuhBackup
            properties:
              backupCount:
                description: BackupCount is the total number of backups currently
                  stored
                format: int32
                type: integer
              backupHistory:
                description: BackupHistory contains recent backup results (last N
                  backups)
                items:
                  description: BackupInfo contains information about a backup execution
                  properties:
                    duration:
                      description: Duration is how long the backup took
                      type: string
                    location:
                      description: Location is the backup storage path
                      type: string
                    message:
                      description: Message contains error message if failed
                      type: string
                    size:
                      description: Size is the backup size (human-readable)
                      type: string
                    status:
                      description: Status is the backup result (Success, Failed)
                      type: string
                    time:
                      description: Time is when the backup was created
                      format: date-time
                      type: string
                  required:
                  - status
                  - time
                  type: object
                type: array
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cronJobName:
                description: |-
                  CronJobName is the name of the generated CronJob
                  Only set for scheduled backups
                type: string
              jobName:
                description: |-
                  JobName is the name of the generated one-shot Job
                  Only set for one-shot backups
                type: string
              lastBackup:
                description: LastBackup contains information about the last backup
                properties:
                  duration:
                    description: Duration is how long the backup took
                    type: string
                  location:
                    description: Location is the backup storage path
                    type: string
                  message:
                    description: Message contains error message if failed
                    type: string
                  size:
                    description: Size is the backup size (human-readable)
                    type: string
                  status:
                    description: Status is the backup result (Success, Failed)
                    type: string
                  time:
                    description: Time is when the backup was created
                    format: date-time
                    type: string
                required:
                - status
                - time
                type: object
              message:
                description: Message provides additional information about the current
                  phase
                type: string
              nextScheduledBackup:
                description: |-
                  NextScheduledBackup is when the next backup will run
                  Only set for scheduled backups
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last observed generation
                format: int64
                type: integer
              phase:
                description: Phase is the current phase (Pending, Active, Suspended,
                  Failed)
                enum:
                - Pending
                - Active
                - Suspended
                - Failed
                type: string
              totalSize:
                description: TotalSize is the total size of all backups (human-readable)
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
