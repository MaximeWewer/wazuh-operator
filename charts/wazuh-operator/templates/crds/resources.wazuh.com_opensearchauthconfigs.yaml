{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: opensearchauthconfigs.resources.wazuh.com
spec:
  group: resources.wazuh.com
  names:
    kind: OpenSearchAuthConfig
    listKind: OpenSearchAuthConfigList
    plural: opensearchauthconfigs
    shortNames:
    - osauthconfig
    - osauth
    singular: opensearchauthconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.basicAuth.enabled
      name: Basic
      type: boolean
    - jsonPath: .spec.oidc.enabled
      name: OIDC
      type: boolean
    - jsonPath: .spec.saml.enabled
      name: SAML
      type: boolean
    - jsonPath: .spec.ldap.enabled
      name: LDAP
      type: boolean
    - jsonPath: .spec.jwt.enabled
      name: JWT
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          OpenSearchAuthConfig is the Schema for the opensearchauthconfigs API
          It manages authentication configuration for OpenSearch clusters including
          basic auth, OIDC, SAML, LDAP, and JWT authentication methods.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenSearchAuthConfigSpec defines the desired state of OpenSearchAuthConfig
            properties:
              basicAuth:
                description: BasicAuth configures HTTP Basic authentication against
                  internal users database
                properties:
                  challenge:
                    default: true
                    description: |-
                      Challenge enables the WWW-Authenticate challenge header. Keep this true (the
                      default) so local accounts stay reachable; SSO domains must use challenge=false
                      (their default) since only one domain may issue the challenge.
                    type: boolean
                  enabled:
                    default: true
                    description: |-
                      Enabled is retained for backward compatibility but no longer removes the
                      internal basic auth domain (it is always kept). Setting it to false is
                      ignored and the operator emits a warning. Use Order/Challenge to tune behavior.
                    type: boolean
                  httpEnabled:
                    default: true
                    description: |-
                      HTTPEnabled is forced on by the operator (the basic domain must always be
                      usable on the HTTP layer for service accounts); this field has no effect.
                    type: boolean
                  order:
                    default: 0
                    description: |-
                      Order determines the evaluation order of this auth domain
                      Lower numbers are evaluated first
                    maximum: 100
                    minimum: 0
                    type: integer
                  transportEnabled:
                    default: true
                    description: TransportEnabled is forced on by the operator; this
                      field has no effect.
                    type: boolean
                type: object
              clusterRefs:
                description: |-
                  ClusterRefs lists the WazuhCluster instances this resource targets.
                  Each entry must specify both name and namespace.
                items:
                  description: |-
                    WazuhClusterRef references a WazuhCluster by name and namespace.
                    Both fields are mandatory; cross-namespace references are supported and
                    require the consuming CR to opt into multi-cluster propagation via
                    ClusterRefs lists.
                  properties:
                    name:
                      description: Name of the WazuhCluster resource
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the WazuhCluster resource
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              jwt:
                description: |-
                  JWT configures JSON Web Token (bearer token) authentication.
                  Tokens are validated against a static signing key or a remote JWKS
                  endpoint, making this suitable for proxy-injected tokens such as
                  Teleport application access (Teleport-Jwt-Assertion header).
                properties:
                  challenge:
                    default: false
                    description: |-
                      Challenge enables authentication challenge
                      JWT is non-interactive; this should stay false when other domains are enabled
                    type: boolean
                  clockSkewToleranceSeconds:
                    description: |-
                      ClockSkewToleranceSeconds is the allowed leeway when validating the
                      "exp" and "nbf" claims, to absorb clock drift between issuer and cluster.
                    minimum: 0
                    type: integer
                  enabled:
                    default: false
                    description: Enabled enables JWT authentication
                    type: boolean
                  httpEnabled:
                    default: true
                    description: HTTPEnabled enables authentication on HTTP layer
                    type: boolean
                  jwksUrl:
                    description: |-
                      JwksURL is the JSON Web Key Set endpoint used to fetch public keys for
                      signature verification. Use this for issuers that rotate keys, such as
                      Teleport (e.g. https://teleport.example.com/.well-known/jwks.json).
                      Routed automatically to the authenticator the target OpenSearch version
                      supports: the openid authenticator on < 3.3, the native jwt authenticator on
                      >= 3.3 (which is the first version whose jwt authenticator accepts jwks_uri).
                      Either SigningKeyRef or JwksURL must be specified.
                    type: string
                  jwtHeader:
                    default: Authorization
                    description: |-
                      JwtHeader is the HTTP header carrying the bearer token.
                      Defaults to "Authorization" (expects a "Bearer <token>" value).
                      Teleport application access injects "Teleport-Jwt-Assertion".
                    type: string
                  jwtUrlParameter:
                    description: |-
                      JwtURLParameter reads the token from a URL query parameter instead of a
                      header. Mutually exclusive with header-based extraction in practice.
                    type: string
                  order:
                    default: 4
                    description: Order determines the evaluation order of this auth
                      domain
                    maximum: 100
                    minimum: 0
                    type: integer
                  requiredAudience:
                    description: RequiredAudience rejects tokens whose "aud" claim
                      does not match.
                    type: string
                  requiredIssuer:
                    description: RequiredIssuer rejects tokens whose "iss" claim does
                      not match.
                    type: string
                  rolesKey:
                    description: RolesKey is the JWT claim containing the user's backend
                      roles.
                    type: string
                  signingKeyRef:
                    description: |-
                      SigningKeyRef references a Secret containing the JWT signing key used to
                      verify token signatures. The value is base64-decoded by the security plugin
                      with a strict decoder (no embedded newlines): for HMAC it is the base64-encoded
                      shared secret; for RSA/ECDSA it is the base64 of the DER public key on a single
                      line (the PEM body with headers and line breaks stripped) — a wrapped multi-line
                      PEM fails to parse. Works on all OpenSearch versions (jwt authenticator).
                      Either SigningKeyRef or JwksURL must be specified.
                    properties:
                      key:
                        default: password
                        description: Key is the key in the secret
                        type: string
                      name:
                        description: Name is the secret name
                        type: string
                    required:
                    - name
                    type: object
                  subjectKey:
                    description: |-
                      SubjectKey is the JWT claim to use as the username.
                      When empty, OpenSearch falls back to the standard "sub" claim.
                    type: string
                  transportEnabled:
                    default: false
                    description: TransportEnabled enables authentication on transport
                      layer
                    type: boolean
                type: object
              ldap:
                description: LDAP configures LDAP/Active Directory authentication
                properties:
                  authentication:
                    description: Authentication configures LDAP authentication settings
                    properties:
                      bindDn:
                        description: |-
                          BindDN is the DN to bind for LDAP searches
                          Example: cn=admin,dc=example,dc=com
                        type: string
                      bindPasswordRef:
                        description: BindPasswordRef references a Secret containing
                          the bind password
                        properties:
                          key:
                            default: password
                            description: Key is the key in the secret
                            type: string
                          name:
                            description: Name is the secret name
                            type: string
                        required:
                        - name
                        type: object
                      userBase:
                        description: |-
                          UserBase is the base DN for user searches
                          Example: ou=users,dc=example,dc=com
                        type: string
                      userSearch:
                        default: (uid={0})
                        description: |-
                          UserSearch is the LDAP filter for finding users
                          Example: (uid={0}) or (sAMAccountName={0}) for AD
                        type: string
                      usernameAttribute:
                        default: uid
                        description: UsernameAttribute is the attribute containing
                          the username
                        type: string
                    required:
                    - userBase
                    type: object
                  authorization:
                    description: Authorization configures LDAP authorization/role
                      mapping
                    properties:
                      enabled:
                        default: true
                        description: Enabled enables LDAP authorization
                        type: boolean
                      resolveNestedRoles:
                        default: false
                        description: ResolveNestedRoles enables nested group resolution
                        type: boolean
                      roleBase:
                        description: |-
                          RoleBase is the base DN for role searches
                          Example: ou=groups,dc=example,dc=com
                        type: string
                      roleName:
                        default: cn
                        description: RoleName is the attribute containing the role
                          name
                        type: string
                      roleSearch:
                        default: (member={0})
                        description: |-
                          RoleSearch is the LDAP filter for finding roles
                          Example: (member={0}) or (memberUid={1})
                        type: string
                      skipUsers:
                        default: false
                        description: SkipUsers disables user authorization (role-only
                          mode)
                        type: boolean
                      userRoleName:
                        description: |-
                          UserRoleName is the user attribute for role membership
                          Example: memberOf (for AD)
                        type: string
                    required:
                    - roleBase
                    type: object
                  challenge:
                    default: false
                    description: |-
                      Challenge enables authentication challenge
                      Should typically be false when multiple auth methods are enabled
                    type: boolean
                  enabled:
                    default: false
                    description: Enabled enables LDAP authentication
                    type: boolean
                  hosts:
                    description: Hosts is the list of LDAP server hostnames or IPs
                    items:
                      type: string
                    minItems: 1
                    type: array
                  httpEnabled:
                    default: true
                    description: HTTPEnabled enables authentication on HTTP layer
                    type: boolean
                  order:
                    default: 3
                    description: Order determines the evaluation order of this auth
                      domain
                    maximum: 100
                    minimum: 0
                    type: integer
                  tls:
                    description: TLS configures LDAP TLS/SSL settings
                    properties:
                      enableSsl:
                        default: false
                        description: EnableSSL enables LDAPS (port 636)
                        type: boolean
                      enableStartTls:
                        default: false
                        description: EnableStartTLS enables STARTTLS on standard port
                        type: boolean
                      pemTrustedCasFilepath:
                        description: PemTrustedCAsFilepath is the path to trusted
                          CA certificates
                        type: string
                      trustAllCertificates:
                        default: false
                        description: TrustAllCertificates disables certificate verification
                          (insecure)
                        type: boolean
                      trustedCAsSecretRef:
                        description: |-
                          TrustedCAsSecretRef references a Secret holding the PEM CA bundle to trust for the
                          LDAPS/StartTLS connection, emitted inline as pemtrustedcas_content. A CA certificate
                          is not secret; a Secret just keeps a multi-line bundle out of the CR. Mutually
                          exclusive with pemTrustedCAsFilepath per OpenSearch.
                        properties:
                          key:
                            default: password
                            description: Key is the key in the secret
                            type: string
                          name:
                            description: Name is the secret name
                            type: string
                        required:
                        - name
                        type: object
                      verifyHostnames:
                        default: true
                        description: VerifyHostnames enables hostname verification
                        type: boolean
                    type: object
                  transportEnabled:
                    default: false
                    description: TransportEnabled enables authentication on transport
                      layer
                    type: boolean
                required:
                - authentication
                type: object
              oidc:
                description: OIDC configures OpenID Connect authentication
                properties:
                  challenge:
                    default: false
                    description: |-
                      Challenge enables authentication challenge
                      Should typically be false when multiple auth methods are enabled
                    type: boolean
                  clientId:
                    description: ClientID is the OAuth 2.0 client ID
                    type: string
                  clientSecretRef:
                    description: ClientSecretRef references a Secret containing the
                      client secret
                    properties:
                      key:
                        default: password
                        description: Key is the key in the secret
                        type: string
                      name:
                        description: Name is the secret name
                        type: string
                    required:
                    - name
                    type: object
                  connectURL:
                    description: |-
                      ConnectURL is the OpenID Connect discovery endpoint URL
                      Example: https://keycloak.example.com/realms/wazuh/.well-known/openid-configuration
                    type: string
                  dashboard:
                    description: Dashboard configures OIDC-specific dashboard settings
                    properties:
                      additionalCookies:
                        description: |-
                          AdditionalCookies is the number of extra split cookies opensearch-dashboards may use to
                          store a large OIDC session (emitted as openid.extra_storage.additional_cookies).
                        items:
                          type: string
                        type: array
                      cookiePasswordRef:
                        description: |-
                          CookiePasswordRef references a Secret holding the session-cookie signing password
                          (auto-generated and persisted if not set).
                        properties:
                          key:
                            default: password
                            description: Key is the key in the secret
                            type: string
                          name:
                            description: Name is the secret name
                            type: string
                        required:
                        - name
                        type: object
                      rootUrl:
                        description: |-
                          RootURL is the dashboard's public base URL (scheme + host, no path). It is emitted as
                          opensearch_security.openid.base_redirect_url. Set it whenever the dashboard is reached
                          through a reverse proxy or Ingress: without it the security plugin builds the OIDC
                          redirect_uri from server.host, so the login flow starts at https://0.0.0.0:5601/auth/openid/login
                          (the in-pod address) instead of your public URL, and the IdP rejects the callback.
                          Example: https://wazuh.example.com
                        type: string
                    type: object
                  enabled:
                    default: false
                    description: Enabled enables OIDC authentication
                    type: boolean
                  httpEnabled:
                    default: true
                    description: HTTPEnabled enables authentication on HTTP layer
                    type: boolean
                  idpTLS:
                    description: |-
                      IdpTLS configures TLS trust for the security plugin's connection to the OIDC
                      discovery endpoint when the IdP presents a certificate signed by a private or
                      otherwise untrusted CA.
                    properties:
                      enableSSL:
                        description: |-
                          EnableSSL turns on the custom TLS settings below. When false (default) the JDK/system trust
                          store is used, which is enough for a publicly-trusted IdP certificate.
                        type: boolean
                      trustedCAsSecretRef:
                        description: |-
                          TrustedCAsSecretRef references a Secret holding the PEM CA bundle to trust for the IdP
                          connection, emitted inline as pemtrustedcas_content. A CA certificate is not secret; a Secret
                          just keeps a multi-line bundle out of the CR. Requires enableSSL: true.
                        properties:
                          key:
                            default: password
                            description: Key is the key in the secret
                            type: string
                          name:
                            description: Name is the secret name
                            type: string
                        required:
                        - name
                        type: object
                      verifyHostnames:
                        description: |-
                          VerifyHostnames verifies the IdP certificate hostname. Defaults to true; set false only for
                          an IdP whose certificate does not match its address.
                        type: boolean
                    type: object
                  logoutUrl:
                    description: LogoutURL is the URL to redirect after logout
                    type: string
                  order:
                    default: 1
                    description: Order determines the evaluation order of this auth
                      domain
                    maximum: 100
                    minimum: 0
                    type: integer
                  rolesKey:
                    default: roles
                    description: RolesKey is the JWT claim containing user roles
                    type: string
                  scope:
                    default: openid profile email
                    description: Scope is the OAuth 2.0 scope to request
                    type: string
                  subjectKey:
                    default: preferred_username
                    description: SubjectKey is the JWT claim to use as the username
                    type: string
                required:
                - clientId
                - connectURL
                type: object
              saml:
                description: SAML configures SAML 2.0 authentication
                properties:
                  challenge:
                    default: false
                    description: |-
                      Challenge enables authentication challenge
                      Should typically be false when multiple auth methods are enabled
                    type: boolean
                  dashboard:
                    description: Dashboard configures SAML-specific dashboard settings
                    properties:
                      xsrfAllowlist:
                        description: |-
                          XSRFAllowlist specifies URLs to exclude from XSRF protection
                          Typically includes the SAML ACS endpoint
                        items:
                          type: string
                        type: array
                    type: object
                  enabled:
                    default: false
                    description: Enabled enables SAML authentication
                    type: boolean
                  exchangeKeyRef:
                    description: |-
                      ExchangeKeyRef references a Secret containing the HMAC256 exchange key
                      Used for signing and encrypting SAML messages
                    properties:
                      key:
                        default: password
                        description: Key is the key in the secret
                        type: string
                      name:
                        description: Name is the secret name
                        type: string
                    required:
                    - name
                    type: object
                  httpEnabled:
                    default: true
                    description: HTTPEnabled enables authentication on HTTP layer
                    type: boolean
                  idpEntityId:
                    description: IdpEntityID is the entity ID of the Identity Provider
                    type: string
                  idpMetadataFile:
                    description: |-
                      IdpMetadataFile is the path to IdP metadata XML file
                      Either IdpMetadataURL or IdpMetadataFile must be specified
                    type: string
                  idpMetadataUrl:
                    description: |-
                      IdpMetadataURL is the URL to fetch IdP metadata from
                      Either IdpMetadataURL or IdpMetadataFile must be specified
                    type: string
                  idpTLS:
                    description: |-
                      IdpTLS configures TLS trust for the security plugin's connection to the SAML IdP
                      metadata URL when the IdP presents a certificate signed by a private or otherwise
                      untrusted CA.
                    properties:
                      enableSSL:
                        description: |-
                          EnableSSL turns on the custom TLS settings below. When false (default) the JDK/system trust
                          store is used, which is enough for a publicly-trusted IdP certificate.
                        type: boolean
                      trustedCAsSecretRef:
                        description: |-
                          TrustedCAsSecretRef references a Secret holding the PEM CA bundle to trust for the IdP
                          connection, emitted inline as pemtrustedcas_content. A CA certificate is not secret; a Secret
                          just keeps a multi-line bundle out of the CR. Requires enableSSL: true.
                        properties:
                          key:
                            default: password
                            description: Key is the key in the secret
                            type: string
                          name:
                            description: Name is the secret name
                            type: string
                        required:
                        - name
                        type: object
                      verifyHostnames:
                        description: |-
                          VerifyHostnames verifies the IdP certificate hostname. Defaults to true; set false only for
                          an IdP whose certificate does not match its address.
                        type: boolean
                    type: object
                  kibanaUrl:
                    description: |-
                      KibanaURL is the base URL of OpenSearch Dashboard
                      Used for assertion consumer service URL
                    type: string
                  order:
                    default: 2
                    description: Order determines the evaluation order of this auth
                      domain
                    maximum: 100
                    minimum: 0
                    type: integer
                  rolesKey:
                    description: RolesKey is the SAML attribute containing user roles
                    type: string
                  spEntityId:
                    description: |-
                      SpEntityID is the entity ID of this Service Provider
                      Usually the Kibana/Dashboard URL
                    type: string
                  subjectKey:
                    default: NameID
                    description: SubjectKey is the SAML attribute to use as the username
                    type: string
                required:
                - idpEntityId
                - kibanaUrl
                - spEntityId
                type: object
            required:
            - clusterRefs
            type: object
          status:
            description: OpenSearchAuthConfigStatus defines the observed state of
              OpenSearchAuthConfig
            properties:
              activeAuthDomains:
                description: ActiveAuthDomains lists the currently active authentication
                  domains
                items:
                  type: string
                type: array
              clusterStatuses:
                description: ClusterStatuses reports per-target-cluster reconciliation
                  state.
                items:
                  description: |-
                    OpenSearchClusterStatus reports the reconciliation state for one target
                    OpenSearch cluster of a multi-cluster CR (User, Role, Tenant, etc.).
                    The aggregate Status.Phase reflects the worst case across entries.
                  properties:
                    lastAppliedHash:
                      description: LastAppliedHash is the hash of the last spec applied
                        to this cluster
                      type: string
                    lastSyncTime:
                      description: LastSyncTime is the last time the resource was
                        synced to this cluster
                      format: date-time
                      type: string
                    message:
                      description: Message provides additional information about this
                        cluster's state
                      type: string
                    name:
                      description: Name of the target WazuhCluster
                      type: string
                    namespace:
                      description: Namespace of the target WazuhCluster
                      type: string
                    phase:
                      description: Phase on this cluster (Pending, Ready, Failed,
                        Conflict)
                      enum:
                      - Pending
                      - Ready
                      - Failed
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configSynced:
                description: ConfigSynced indicates if the security config is in sync
                type: boolean
              dashboardConfigSynced:
                description: DashboardConfigSynced indicates if the dashboard config
                  is in sync
                type: boolean
              lastSyncTime:
                description: LastSyncTime is when the auth config was last synced
                  to OpenSearch
                format: date-time
                type: string
              message:
                description: Message provides additional information about the current
                  phase
                type: string
              observedGeneration:
                description: ObservedGeneration is the last observed generation
                format: int64
                type: integer
              phase:
                description: Phase is the current phase (Pending, Ready, Failed)
                enum:
                - Pending
                - Ready
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
