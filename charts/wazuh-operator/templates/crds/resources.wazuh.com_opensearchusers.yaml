{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: opensearchusers.resources.wazuh.com
spec:
  group: resources.wazuh.com
  names:
    kind: OpenSearchUser
    listKind: OpenSearchUserList
    plural: opensearchusers
    shortNames:
    - osuser
    singular: opensearchuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.driftDetected
      name: Drift
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: OpenSearchUser is the Schema for the opensearchusers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenSearchUserSpec defines the desired state of OpenSearchUser
            properties:
              attributes:
                additionalProperties:
                  type: string
                description: Attributes are custom attributes for the user
                type: object
              backendRoles:
                description: BackendRoles are the backend roles for this user
                items:
                  type: string
                type: array
              clusterRefs:
                description: |-
                  ClusterRefs lists the WazuhCluster instances this resource targets.
                  Each entry must specify both name and namespace.
                items:
                  description: |-
                    WazuhClusterRef references a WazuhCluster by name and namespace.
                    Both fields are mandatory; cross-namespace references are supported and
                    require the consuming CR to opt into multi-cluster propagation via
                    ClusterRefs lists.
                  properties:
                    name:
                      description: Name of the WazuhCluster resource
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the WazuhCluster resource
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              defaultAdmin:
                description: |-
                  DefaultAdmin marks this user as the default admin for the cluster.
                  Only one user per cluster can be marked as defaultAdmin.
                  If multiple users are marked, the first one (by creation timestamp) is used
                  and warnings are emitted for the others.
                type: boolean
              description:
                description: Description is a human-readable description of the user
                maxLength: 1024
                type: string
              hash:
                description: Hash is a pre-computed password hash (alternative to
                  PasswordSecret)
                type: string
              openSearchRoles:
                description: OpenSearchRoles are the OpenSearch security roles to
                  assign to the user
                items:
                  type: string
                type: array
              passwordSecret:
                description: |-
                  PasswordSecret references a Secret containing the user password
                  Uses CredentialsSecretRef for consistency - only the passwordKey is used
                properties:
                  externalSecretRef:
                    description: |-
                      ExternalSecretRef references an ExternalSecret from ESO
                      When specified, the operator will read credentials from the K8s Secret
                      created by the ExternalSecret controller
                    properties:
                      name:
                        description: |-
                          Name of the ExternalSecret resource that will be created/referenced
                          The ExternalSecret will sync the secret from the external provider to a K8s Secret
                        type: string
                      namespace:
                        description: Namespace of the ExternalSecret (defaults to
                          same namespace as the parent resource)
                        type: string
                      refreshInterval:
                        default: 1h
                        description: RefreshInterval is how often to sync the secret
                          (e.g., "1h", "30m")
                        type: string
                      remoteRef:
                        description: RemoteRef specifies the remote secret location
                          in the external provider
                        properties:
                          key:
                            description: |-
                              Key is the key/path in the external secret provider
                              For Vault: "secret/data/myapp/config"
                              For AWS SM: "myapp/database-credentials"
                            type: string
                          property:
                            description: |-
                              Property is the specific property within the secret to extract
                              If not specified, the entire secret is used
                            type: string
                          version:
                            description: Version is the version of the secret to fetch
                              (provider-specific)
                            type: string
                        required:
                        - key
                        type: object
                      secretStoreRef:
                        description: SecretStoreRef references the SecretStore or
                          ClusterSecretStore to use
                        properties:
                          kind:
                            default: SecretStore
                            description: Kind is the kind of secret store (SecretStore
                              or ClusterSecretStore)
                            enum:
                            - SecretStore
                            - ClusterSecretStore
                            type: string
                          name:
                            description: Name of the SecretStore or ClusterSecretStore
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - name
                    type: object
                  passwordKey:
                    default: password
                    description: PasswordKey is the key in the secret containing the
                      password
                    type: string
                  secretName:
                    description: SecretName references a native Kubernetes Secret
                    type: string
                  usernameKey:
                    default: username
                    description: UsernameKey is the key in the secret containing the
                      username
                    type: string
                type: object
            required:
            - clusterRefs
            type: object
          status:
            description: OpenSearchUserStatus defines the observed state of OpenSearchUser
            properties:
              clusterStatuses:
                description: ClusterStatuses reports per-target-cluster reconciliation
                  state.
                items:
                  description: |-
                    OpenSearchClusterStatus reports the reconciliation state for one target
                    OpenSearch cluster of a multi-cluster CR (User, Role, Tenant, etc.).
                    The aggregate Status.Phase reflects the worst case across entries.
                  properties:
                    lastAppliedHash:
                      description: LastAppliedHash is the hash of the last spec applied
                        to this cluster
                      type: string
                    lastSyncTime:
                      description: LastSyncTime is the last time the resource was
                        synced to this cluster
                      format: date-time
                      type: string
                    message:
                      description: Message provides additional information about this
                        cluster's state
                      type: string
                    name:
                      description: Name of the target WazuhCluster
                      type: string
                    namespace:
                      description: Namespace of the target WazuhCluster
                      type: string
                    phase:
                      description: Phase on this cluster (Pending, Ready, Failed,
                        Conflict)
                      enum:
                      - Pending
                      - Ready
                      - Failed
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              conflictsWith:
                description: ConflictsWith is the namespace/name of a conflicting
                  CRD
                type: string
              driftDetected:
                description: DriftDetected indicates if manual modification was detected
                type: boolean
              lastAppliedHash:
                description: LastAppliedHash is the hash of the last applied spec
                  for drift detection
                type: string
              lastDriftTime:
                description: LastDriftTime is when drift was last detected
                format: date-time
                type: string
              lastSyncTime:
                description: LastSyncTime is when the resource was last synced to
                  OpenSearch
                format: date-time
                type: string
              message:
                description: Message provides additional information about the current
                  phase
                type: string
              observedGeneration:
                description: ObservedGeneration is the last observed generation
                format: int64
                type: integer
              ownershipClaimed:
                description: OwnershipClaimed indicates if this CRD owns the OpenSearch
                  resource
                type: boolean
              phase:
                description: Phase is the current phase of the user (Pending, Ready,
                  Failed, Conflict)
                enum:
                - Pending
                - Ready
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
