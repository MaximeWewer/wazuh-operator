{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: wazuhcdblists.resources.wazuh.com
spec:
  group: resources.wazuh.com
  names:
    kind: WazuhCDBList
    listKind: WazuhCDBListList
    plural: wazuhcdblists
    shortNames:
    - wcdb
    singular: wazuhcdblist
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.listName
      name: List
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.entryCount
      name: Entries
      type: integer
    - jsonPath: .spec.targetNodes
      name: Target
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: WazuhCDBList is the Schema for the wazuhcdblists API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WazuhCDBList
            properties:
              clusterRefs:
                description: |-
                  ClusterRefs lists the WazuhCluster instances the CDB list must be applied to.
                  Each entry must specify both name and namespace. The CR can live in any
                  namespace; list ConfigMaps are created in each target cluster's namespace and
                  the operator injects the matching <list> entry into each manager's ossec.conf.
                items:
                  description: |-
                    WazuhClusterRef references a WazuhCluster by name and namespace.
                    Both fields are mandatory; cross-namespace references are supported and
                    require the consuming CR to opt into multi-cluster propagation via
                    ClusterRefs lists.
                  properties:
                    name:
                      description: Name of the WazuhCluster resource
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the WazuhCluster resource
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              content:
                description: |-
                  Content is raw inline list content. Interpreted according to format
                  (CDB format as-is, or an IP list converted to CDB). Mutually exclusive with
                  entries and source.
                type: string
              description:
                description: Description of the CDB list.
                type: string
              entries:
                description: |-
                  Entries is a static, inline list of key/value pairs. Mutually exclusive with
                  content and source. The format field is ignored for entries.
                items:
                  description: CDBListEntry is a single key/value pair in a CDB list.
                  properties:
                    key:
                      description: Key is the lookup key (left side of the "key:value"
                        line). Required.
                      minLength: 1
                      type: string
                    value:
                      description: |-
                        Value is the optional value associated with the key (right side of "key:value").
                        Leave empty for key-only lists (e.g. IP blocklists), which render as "key:".
                      type: string
                  required:
                  - key
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              format:
                default: cdb
                description: |-
                  Format controls how raw content (content or source) is interpreted:
                  "cdb" (already CDB-formatted, default), "iplist" (a plain IP/CIDR list the operator
                  converts to CDB format), or "keylist" (a plain list of keys — hashes, domains,
                  users — converted to key-only entries). Ignored when entries is used.
                enum:
                - cdb
                - iplist
                - keylist
                type: string
              listName:
                description: |-
                  ListName is the CDB list path (without extension) created under
                  /var/ossec/etc/lists/ on the manager. A single filename (e.g. "blocked-ips")
                  or a subdirectory path (e.g. "malicious-ioc/malicious-ip") is allowed; the
                  operator mounts the file at /var/ossec/etc/lists/<listName> and injects the
                  matching <list>etc/lists/<listName></list> entry. Each path segment must be a
                  safe name (no ".", "..", leading/trailing/double slash).
                maxLength: 128
                pattern: ^[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$
                type: string
              skipLines:
                description: |-
                  SkipLines drops the first N lines of raw content (content or source) before
                  conversion, e.g. to strip a file header (VirusShare hash dumps start with a
                  commented header). Ignored when entries is used.
                format: int32
                minimum: 0
                type: integer
              source:
                description: |-
                  Source fetches raw list content from a URL. Interpreted according to format.
                  Mutually exclusive with entries and content.
                properties:
                  headersSecretRef:
                    description: |-
                      HeadersSecretRef references a Secret whose key/value pairs are sent as HTTP
                      request headers (e.g. an "Authorization" key). The Secret must live in the
                      same namespace as the WazuhCDBList CR.
                    properties:
                      key:
                        description: Key is the key in the secret (defaults to "password")
                        type: string
                      name:
                        description: Name is the secret name
                        type: string
                      namespace:
                        description: Namespace of the secret (defaults to the resource
                          namespace)
                        type: string
                    required:
                    - name
                    type: object
                  insecureSkipVerify:
                    default: false
                    description: InsecureSkipVerify disables TLS certificate verification
                      for https URLs.
                    type: boolean
                  refreshInterval:
                    description: |-
                      RefreshInterval controls how often the operator re-fetches the URL.
                      Omit or set to "0" to fetch once (re-fetch only when the CR spec changes).
                      Format is a Go duration string, e.g. "1h", "30m".
                    type: string
                  url:
                    description: URL to fetch the list content from (http or https).
                    pattern: ^https?://.+
                    type: string
                required:
                - url
                type: object
              targetNodes:
                default: all
                description: TargetNodes specifies which manager nodes receive this
                  list (master, workers, or all).
                enum:
                - master
                - workers
                - all
                type: string
            required:
            - clusterRefs
            - listName
            type: object
          status:
            description: status defines the observed state of WazuhCDBList
            properties:
              clusterStatuses:
                description: ClusterStatuses reports per-target-cluster reconciliation
                  state.
                items:
                  description: CDBListClusterStatus reports the reconciliation state
                    for a single target cluster.
                  properties:
                    appliedToNodes:
                      description: AppliedToNodes lists the nodes where this list
                        has been applied on this cluster.
                      items:
                        type: string
                      type: array
                    configMapRef:
                      description: ConfigMapRef references the ConfigMap created in
                        this cluster's namespace.
                      properties:
                        key:
                          description: Key in the ConfigMap
                          type: string
                        name:
                          description: Name of the ConfigMap
                          type: string
                        namespace:
                          description: Namespace of the ConfigMap
                          type: string
                      required:
                      - name
                      type: object
                    lastAppliedTime:
                      description: LastAppliedTime is the last time the list was applied
                        to this cluster.
                      format: date-time
                      type: string
                    message:
                      description: Message provides additional information about this
                        cluster's state.
                      type: string
                    name:
                      description: Name of the target WazuhCluster.
                      type: string
                    namespace:
                      description: Namespace of the target WazuhCluster.
                      type: string
                    phase:
                      description: Phase on this cluster.
                      enum:
                      - Pending
                      - Applied
                      - Failed
                      - Updating
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest aggregate observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contentHash:
                description: ContentHash is a short hash of the resolved list content,
                  used for change detection.
                type: string
              entryCount:
                description: EntryCount is the number of key/value entries in the
                  resolved list.
                format: int32
                type: integer
              lastFetchTime:
                description: LastFetchTime is the last time source content was fetched
                  from the URL.
                format: date-time
                type: string
              message:
                description: Message provides additional aggregate information about
                  the current state.
                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed list.
                format: int64
                type: integer
              phase:
                description: Phase is the aggregate phase across all target clusters.
                enum:
                - Pending
                - Applied
                - Failed
                - Updating
                type: string
              validationErrors:
                description: ValidationErrors contains any validation errors encountered.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
