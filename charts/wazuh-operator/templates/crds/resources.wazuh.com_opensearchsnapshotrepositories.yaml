{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: opensearchsnapshotrepositories.resources.wazuh.com
spec:
  group: resources.wazuh.com
  names:
    kind: OpenSearchSnapshotRepository
    listKind: OpenSearchSnapshotRepositoryList
    plural: opensearchsnapshotrepositories
    shortNames:
    - osrepo
    singular: opensearchsnapshotrepository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.settings.bucket
      name: Bucket
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.verified
      name: Verified
      type: boolean
    - jsonPath: .status.snapshotCount
      name: Snapshots
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: OpenSearchSnapshotRepository is the Schema for the opensearchsnapshotrepositories
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenSearchSnapshotRepositorySpec defines the desired state
              of OpenSearchSnapshotRepository
            properties:
              clusterRefs:
                description: |-
                  ClusterRefs lists the WazuhCluster instances this resource targets.
                  Each entry must specify both name and namespace.
                items:
                  description: |-
                    WazuhClusterRef references a WazuhCluster by name and namespace.
                    Both fields are mandatory; cross-namespace references are supported and
                    require the consuming CR to opt into multi-cluster propagation via
                    ClusterRefs lists.
                  properties:
                    name:
                      description: Name of the WazuhCluster resource
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the WazuhCluster resource
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              settings:
                description: Settings contains type-specific repository configuration
                properties:
                  applicationName:
                    description: ApplicationName is the GCS application name (gcs
                      type only)
                    type: string
                  basePath:
                    description: BasePath is the path within the bucket
                    type: string
                  bucket:
                    description: Bucket is the bucket name (s3, gcs, azure)
                    type: string
                  cannedAcl:
                    description: CannedACL is the S3 canned ACL (e.g., "private",
                      "public-read")
                    type: string
                  chunkSize:
                    description: ChunkSize is the chunk size for large files (e.g.,
                      "1gb")
                    type: string
                  client:
                    default: default
                    description: |-
                      Client is the named client for keystore-based credentials
                      Corresponds to the clientName in RepositoryPluginConfig
                      Used by S3, GCS, and Azure repository types
                    type: string
                  compress:
                    default: true
                    description: Compress enables snapshot compression
                    type: boolean
                  container:
                    description: Container is the Azure container name
                    type: string
                  credentialsSecret:
                    description: CredentialsSecret references credentials for cloud
                      storage
                    properties:
                      accessKeyKey:
                        default: access-key
                        description: AccessKeyKey is the key in the Secret for the
                          access key ID
                        type: string
                      name:
                        description: Name of the Secret containing credentials
                        type: string
                      secretKeyKey:
                        default: secret-key
                        description: SecretKeyKey is the key in the Secret for the
                          secret access key
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: Endpoint is a custom endpoint (MinIO, S3-compatible)
                    type: string
                  endpointSuffix:
                    description: |-
                      EndpointSuffix is the Azure endpoint suffix for sovereign clouds (azure type only)
                      Example: "core.chinacloudapi.cn" for Azure China
                    type: string
                  hadoopConf:
                    additionalProperties:
                      type: string
                    description: |-
                      HadoopConf is extra Hadoop configuration for HDFS (hdfs type only)
                      Keys are prefixed with "conf." when sent to OpenSearch
                    type: object
                  location:
                    description: Location is the filesystem path (fs type only)
                    type: string
                  maxRestoreBytesPerSec:
                    description: MaxRestoreBytesPerSec limits restore bandwidth (e.g.,
                      "40mb")
                    type: string
                  maxSnapshotBytesPerSec:
                    description: MaxSnapshotBytesPerSec limits snapshot bandwidth
                      (e.g., "40mb")
                    type: string
                  path:
                    description: Path is the HDFS directory path (hdfs type only)
                    type: string
                  pathStyleAccess:
                    description: PathStyleAccess enables path-style access (MinIO)
                    type: boolean
                  protocol:
                    description: |-
                      Protocol is the connection protocol (s3 type only)
                      Use "http" for MinIO or other S3-compatible services without TLS
                    enum:
                    - http
                    - https
                    type: string
                  readonly:
                    description: ReadOnly marks the repository as read-only
                    type: boolean
                  region:
                    description: Region is the cloud region (s3)
                    type: string
                  securityPrincipal:
                    description: SecurityPrincipal is the Kerberos principal for HDFS
                      (hdfs type only)
                    type: string
                  serverSideEncryption:
                    description: ServerSideEncryption enables server-side encryption
                      (s3)
                    type: boolean
                  storageClass:
                    description: StorageClass is the S3 storage class (e.g., "standard",
                      "reduced_redundancy")
                    type: string
                  uri:
                    description: |-
                      URI is the HDFS namenode URI (hdfs type only)
                      Example: "hdfs://namenode:8020"
                    type: string
                  useKeystore:
                    description: |-
                      UseKeystore indicates that credentials are stored in the OpenSearch keystore
                      When true, inline credentials (access_key/secret_key) are not set in repository settings
                      The operator expects the keystore to be populated via RepositoryPlugins in WazuhCluster
                    type: boolean
                type: object
              type:
                description: |-
                  Type is the repository type
                  Note: s3/gcs/azure/hdfs types require the corresponding repository plugin to be installed
                enum:
                - s3
                - azure
                - fs
                - gcs
                - hdfs
                type: string
              verify:
                default: true
                description: Verify enables repository verification after creation
                type: boolean
            required:
            - clusterRefs
            - settings
            - type
            type: object
          status:
            description: OpenSearchSnapshotRepositoryStatus defines the observed state
              of OpenSearchSnapshotRepository
            properties:
              clusterStatuses:
                description: ClusterStatuses reports per-target-cluster reconciliation
                  state.
                items:
                  description: |-
                    OpenSearchClusterStatus reports the reconciliation state for one target
                    OpenSearch cluster of a multi-cluster CR (User, Role, Tenant, etc.).
                    The aggregate Status.Phase reflects the worst case across entries.
                  properties:
                    lastAppliedHash:
                      description: LastAppliedHash is the hash of the last spec applied
                        to this cluster
                      type: string
                    lastSyncTime:
                      description: LastSyncTime is the last time the resource was
                        synced to this cluster
                      format: date-time
                      type: string
                    message:
                      description: Message provides additional information about this
                        cluster's state
                      type: string
                    name:
                      description: Name of the target WazuhCluster
                      type: string
                    namespace:
                      description: Namespace of the target WazuhCluster
                      type: string
                    phase:
                      description: Phase on this cluster (Pending, Ready, Failed,
                        Conflict)
                      enum:
                      - Pending
                      - Ready
                      - Failed
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: LastSyncTime is when the resource was last synced to
                  OpenSearch
                format: date-time
                type: string
              lastVerifiedTime:
                description: LastVerifiedTime is when verification last succeeded
                format: date-time
                type: string
              message:
                description: Message provides additional information about the current
                  phase
                type: string
              observedGeneration:
                description: ObservedGeneration is the last observed generation
                format: int64
                type: integer
              phase:
                description: Phase is the current phase (Pending, Creating, Verifying,
                  Ready, Failed, Deleting)
                enum:
                - Pending
                - Creating
                - Verifying
                - Ready
                - Failed
                - Deleting
                type: string
              snapshotCount:
                description: SnapshotCount is the number of snapshots in the repository
                format: int32
                type: integer
              verified:
                description: Verified indicates if the repository was successfully
                  verified
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
