  names:
    kind: WazuhAgentGroupAssignment
    listKind: WazuhAgentGroupAssignmentList
    plural: wazuhagentgroupassignments
    shortNames:
    - waga
    singular: wazuhagentgroupassignment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.groups
