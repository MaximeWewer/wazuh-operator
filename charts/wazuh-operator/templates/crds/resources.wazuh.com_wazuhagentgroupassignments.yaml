      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          WazuhAgentGroupAssignment is the Schema for the wazuhagentgroupassignments API.
          It assigns Wazuh agents to groups (authoritative/exclusive) by matching agent
          names, via the Wazuh Manager API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WazuhAgentGroupAssignment
            properties:
              clusterRefs:
                description: |-
                  ClusterRefs lists the WazuhCluster instances this assignment targets.
                  Each entry must specify both name and namespace.
                items:
                  description: |-
                    WazuhClusterRef references a WazuhCluster by name and namespace.
                    Both fields are mandatory; cross-namespace references are supported and
                    require the consuming CR to opt into multi-cluster propagation via
                    ClusterRefs lists.
                  properties:
                    name:
                      description: Name of the WazuhCluster resource
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the WazuhCluster resource
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              groups:
                description: |-
                  Groups is the exact set of groups every matched agent must belong to.
                  Membership is authoritative: groups on an agent that are not listed here
                  are removed (Wazuh reassigns "default" if an agent ends up group-less).
                items:
                  type: string
                minItems: 1
                type: array
              reconcileIntervalSeconds:
                default: 60
                description: |-
                  ReconcileIntervalSeconds controls how often agents are re-scanned. Agents
                  register dynamically, so a new agent matching a pattern must be picked up
                  without a spec change. Minimum 15 seconds.
                minimum: 15
                type: integer
              selector:
                description: |-
                  Selector describes how agents are matched by name. At least one of the
                  three lists must be non-empty (enforced by the validating webhook). An
                  agent matches if ANY entry in ANY list matches its name.
                properties:
                  agentNames:
                    description: AgentNames matches agents by exact name.
                    items:
                      type: string
                    type: array
                  namePatterns:
                    description: |-
                      NamePatterns matches agents by shell glob (Go path.Match semantics),
                      e.g. "web-*".
                    items:
                      type: string
                    type: array
                  nameRegex:
                    description: NameRegex matches agents by RE2 regular expression,
                      e.g. "^web-\\d+$".
                    items:
                      type: string
                    type: array
                  osPlatforms:
                    description: |-
                      OSPlatforms matches the agent's reported os.platform (the controlled short value:
                      ubuntu, debian, centos, redhat, amzn, windows, darwin, ...). Case-insensitive.
                      Note: macOS reports as "darwin"; the aliases "macos" and "osx" are accepted and
                      normalized to "darwin". os.version is intentionally NOT a selector - it is a
                      freeform string (e.g. "16.04.6 LTS (Xenial Xerus)") and cannot be matched reliably.
                    items:
                      type: string
                    type: array
                type: object
            required:
            - clusterRefs
            - groups
            - selector
            type: object
          status:
            description: status defines the observed state of WazuhAgentGroupAssignment
            properties:
              clusterStatuses:
                description: ClusterStatuses reports per-target-cluster reconciliation
                  state.
                items:
                  description: |-
                    AgentGroupAssignmentClusterStatus reports reconciliation state for a single
                    cluster. Matched agent IDs are tracked per entry so the finalizer can revert
                    this assignment's changes on delete.
                  properties:
                    lastAppliedHash:
                      description: |-
                        LastAppliedHash is the hash of the last spec applied to this cluster.
                        Informational only: the reconciler always re-scans so dynamically
                        registered agents are picked up.
                      type: string
                    lastSyncTime:
                      description: LastSyncTime is the last time this cluster was
                        synced with its Wazuh API.
                      format: date-time
                      type: string
                    managedAgentIds:
                      description: |-
                        ManagedAgentIDs are the agent IDs this CR currently manages on this
                        cluster. Used by the finalizer to revert group membership on delete.
                      items:
                        type: string
                      type: array
                    matchedAgentCount:
                      description: MatchedAgentCount is the number of agents matched
                        on this cluster.
                      format: int32
                      type: integer
                    message:
                      description: Message provides additional information about this
                        cluster's state.
                      type: string
                    name:
                      description: Name of the target WazuhCluster.
                      type: string
                    namespace:
                      description: Namespace of the target WazuhCluster.
                      type: string
                    phase:
                      description: Phase of this cluster's reconciliation (Pending,
                        Ready, Failed).
                      enum:
                      - Pending
                      - Ready
                      - Failed
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest aggregate observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message provides additional aggregate information about
                  the current state.
                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed spec.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is the aggregate phase across all target clusters.
                  Ready when every cluster is Ready; Failed if any is Failed; Pending otherwise.
                enum:
                - Pending
                - Ready
                - Failed
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
