{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: wazuhintegrations.resources.wazuh.com
spec:
  group: resources.wazuh.com
  names:
    kind: WazuhIntegration
    listKind: WazuhIntegrationList
    plural: wazuhintegrations
    shortNames:
    - wintegration
    singular: wazuhintegration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Integration
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.targetNodes
      name: Target
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: WazuhIntegration is the Schema for the wazuhintegrations API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WazuhIntegrationSpec defines the desired state of WazuhIntegration.

              A WazuhIntegration provisions a Wazuh "custom integration": it ships an
              executable script to /var/ossec/integrations/<integrationName> on the target
              manager nodes AND injects the matching <integration> block into ossec.conf so
              wazuh-integratord forwards alerts to the script.
              See https://documentation.wazuh.com/current/user-manual/manager/manual-integration.html
            properties:
              alertFormat:
                default: json
                description: |-
                  AlertFormat controls the format of the alert handed to the script (<alert_format>).
                  "json" passes a JSON alert file (recommended for custom scripts).
                enum:
                - json
                - full_log
                type: string
              apiKeySecretRef:
                description: |-
                  APIKeySecretRef reads the integration API key from a Secret in the target
                  cluster's namespace. The resolved value is rendered as <api_key> in
                  ossec.conf and passed to the script (argv[2]).
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              clusterRefs:
                description: |-
                  ClusterRefs lists the WazuhCluster instances the integration must be applied to.
                  Each entry must specify both name and namespace. The CR can live in any
                  namespace; the script ConfigMap is created in each target cluster's namespace.
                items:
                  description: |-
                    WazuhClusterRef references a WazuhCluster by name and namespace.
                    Both fields are mandatory; cross-namespace references are supported and
                    require the consuming CR to opt into multi-cluster propagation via
                    ClusterRefs lists.
                  properties:
                    name:
                      description: Name of the WazuhCluster resource
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the WazuhCluster resource
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              eventLocation:
                description: EventLocation filters alerts by their source location
                  (<location>).
                type: string
              group:
                description: Group filters alerts by rule group (<group>). Comma-separated
                  groups are allowed.
                type: string
              hookURL:
                description: |-
                  HookURL is the endpoint passed to the script (argv[3]) and rendered as
                  <hook_url>. Use HookURLSecretRef instead when the URL is sensitive.
                type: string
              hookURLSecretRef:
                description: |-
                  HookURLSecretRef reads the hook URL from a Secret in the target cluster's
                  namespace. When set, it overrides HookURL.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              level:
                description: Level filters alerts by minimum severity level before
                  they reach the integration.
                format: int32
                maximum: 16
                minimum: 0
                type: integer
              name:
                description: |-
                  Name is the integration's logical name WITHOUT the "custom-" prefix
                  (e.g. "jira"). The operator forces the Wazuh custom-integration convention:
                  the script filename and the <integration> <name> tag are both derived as
                  custom-<name>[.<scriptExtension>] (see ScriptName).
                maxLength: 50
                pattern: ^[a-zA-Z0-9_-]+$
                type: string
              options:
                description: |-
                  Options is an optional raw JSON string rendered inside <options>...</options>,
                  forwarded verbatim to the integration.
                type: string
              ruleID:
                description: RuleID filters alerts so only the listed rule IDs are
                  forwarded (<rule_id>).
                items:
                  format: int32
                  type: integer
                type: array
              script:
                description: |-
                  Script is the content of the integration executable. It is mounted with
                  mode 0750 at /var/ossec/integrations/<integrationName>. The first line
                  must be a shebang (e.g. "#!/usr/bin/env python3" or "#!/bin/sh").
                type: string
              scriptExtension:
                description: |-
                  ScriptExtension is the optional file extension (without the leading dot)
                  appended to the generated script filename, e.g. "py" → custom-<name>.py,
                  "sh" → custom-<name>.sh. When empty the script is named custom-<name>.
                  wazuh-integratord executes the file named exactly like the <name> tag, so
                  the operator keeps both in sync.
                maxLength: 10
                pattern: ^[a-zA-Z0-9]+$
                type: string
              targetNodes:
                default: all
                description: TargetNodes selects which manager nodes receive the integration
                  (master, workers, or all).
                enum:
                - master
                - workers
                - all
                type: string
            required:
            - clusterRefs
            - name
            - script
            type: object
          status:
            description: WazuhIntegrationStatus defines the observed state of WazuhIntegration.
            properties:
              clusterStatuses:
                description: ClusterStatuses reports per-target-cluster reconciliation
                  state.
                items:
                  description: IntegrationClusterStatus reports the reconciliation
                    state for a single target cluster.
                  properties:
                    appliedToNodes:
                      description: AppliedToNodes lists the nodes where this integration
                        has been applied on this cluster.
                      items:
                        type: string
                      type: array
                    configMapRef:
                      description: ConfigMapRef references the script ConfigMap created
                        in this cluster's namespace.
                      properties:
                        key:
                          description: Key in the ConfigMap
                          type: string
                        name:
                          description: Name of the ConfigMap
                          type: string
                        namespace:
                          description: Namespace of the ConfigMap
                          type: string
                      required:
                      - name
                      type: object
                    lastAppliedTime:
                      description: LastAppliedTime is the last time the integration
                        was applied to this cluster.
                      format: date-time
                      type: string
                    message:
                      description: Message provides additional information about this
                        cluster's state.
                      type: string
                    name:
                      description: Name of the target WazuhCluster.
                      type: string
                    namespace:
                      description: Namespace of the target WazuhCluster.
                      type: string
                    phase:
                      description: Phase on this cluster.
                      enum:
                      - Pending
                      - Applied
                      - Failed
                      - Updating
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest aggregate observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message provides additional aggregate information about
                  the current state.
                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed integration.
                format: int64
                type: integer
              phase:
                description: Phase is the aggregate phase across all target clusters.
                enum:
                - Pending
                - Applied
                - Failed
                - Updating
                type: string
              validationErrors:
                description: ValidationErrors contains any validation errors encountered.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
