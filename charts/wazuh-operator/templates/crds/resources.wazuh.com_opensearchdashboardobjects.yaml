{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: opensearchdashboardobjects.resources.wazuh.com
spec:
  group: resources.wazuh.com
  names:
    kind: OpenSearchDashboardObject
    listKind: OpenSearchDashboardObjectList
    plural: opensearchdashboardobjects
    shortNames:
    - osdashobj
    singular: opensearchdashboardobject
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.tenant
      name: Tenant
      type: string
    - jsonPath: .status.objectCount
      name: Objects
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          OpenSearchDashboardObject manages OpenSearch Dashboards saved objects (dashboards,
          visualizations, index patterns, saved searches) from an NDJSON export kept in Git.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OpenSearchDashboardObjectSpec defines the desired state of
              OpenSearchDashboardObject
            properties:
              clusterRefs:
                description: |-
                  ClusterRefs lists the WazuhCluster instances this resource targets.
                  Each entry must specify both name and namespace.
                items:
                  description: |-
                    WazuhClusterRef references a WazuhCluster by name and namespace.
                    Both fields are mandatory; cross-namespace references are supported and
                    require the consuming CR to opt into multi-cluster propagation via
                    ClusterRefs lists.
                  properties:
                    name:
                      description: Name of the WazuhCluster resource
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the WazuhCluster resource
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              prune:
                default: true
                description: |-
                  Prune deletes the objects previously imported by this resource that are no longer
                  in the source. Objects that never came from this resource are never deleted.
                type: boolean
              resyncInterval:
                default: 10m
                description: |-
                  ResyncInterval is how often the objects are re-imported even when the source did
                  not change. The source is the truth: any change made in the Dashboards UI to a
                  managed object is overwritten at the next sync.
                type: string
              source:
                description: |-
                  Source holds the saved objects, as an NDJSON export from Dashboards
                  (Stack Management > Saved objects > Export).
                properties:
                  configMapRef:
                    description: |-
                      ConfigMapRef reads the export from a ConfigMap key in the resource's namespace;
                      changes to the ConfigMap are picked up immediately.
                    properties:
                      key:
                        default: export.ndjson
                        description: Key holding the NDJSON export.
                        type: string
                      name:
                        description: Name of the ConfigMap.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  ndjson:
                    description: NDJSON is the saved objects export, one JSON object
                      per line.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of ndjson or configMapRef must be set
                  rule: has(self.ndjson) != has(self.configMapRef)
              tenant:
                default: global
                description: |-
                  Tenant is the OpenSearch Dashboards tenant the objects are imported into: "global"
                  (shared, the default), "private" (the operator admin user's private tenant) or the
                  name of a custom tenant (see OpenSearchTenant). An empty value sends no tenant and
                  lets the dashboard pick the admin user's default tenant - its private one when
                  multi-tenancy is enabled, as on a stock Wazuh dashboard - so the objects would not be
                  visible to other users.
                maxLength: 128
                type: string
            required:
            - clusterRefs
            - source
            type: object
          status:
            description: OpenSearchDashboardObjectStatus defines the observed state
              of OpenSearchDashboardObject
            properties:
              clusterStatuses:
                description: ClusterStatuses reports per-target-cluster reconciliation
                  state.
                items:
                  description: |-
                    OpenSearchClusterStatus reports the reconciliation state for one target
                    OpenSearch cluster of a multi-cluster CR (User, Role, Tenant, etc.).
                    The aggregate Status.Phase reflects the worst case across entries.
                  properties:
                    lastAppliedHash:
                      description: LastAppliedHash is the hash of the last spec applied
                        to this cluster
                      type: string
                    lastSyncTime:
                      description: LastSyncTime is the last time the resource was
                        synced to this cluster
                      format: date-time
                      type: string
                    message:
                      description: Message provides additional information about this
                        cluster's state
                      type: string
                    name:
                      description: Name of the target WazuhCluster
                      type: string
                    namespace:
                      description: Namespace of the target WazuhCluster
                      type: string
                    phase:
                      description: Phase on this cluster (Pending, Ready, Failed,
                        Conflict)
                      enum:
                      - Pending
                      - Ready
                      - Failed
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastAppliedHash:
                description: LastAppliedHash is the hash of the last imported source
                  content
                type: string
              lastSyncTime:
                description: LastSyncTime is when the objects were last imported on
                  every target cluster
                format: date-time
                type: string
              message:
                description: Message provides additional information about the current
                  phase
                type: string
              objectCount:
                description: ObjectCount is the number of saved objects managed by
                  this resource
                type: integer
              objects:
                description: |-
                  Objects lists the saved objects managed by this resource, used to prune objects
                  removed from the source and to clean up on deletion.
                items:
                  description: DashboardObjectStatusRef identifies a saved object
                    managed by the resource.
                  properties:
                    id:
                      description: ID of the saved object.
                      type: string
                    type:
                      description: Type of the saved object (dashboard, visualization,
                        index-pattern, search...).
                      type: string
                  required:
                  - id
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the last observed generation
                format: int64
                type: integer
              phase:
                description: Phase is the current phase (Pending, Ready, Failed)
                enum:
                - Pending
                - Ready
                - Failed
                type: string
              tenant:
                description: Tenant is the tenant the managed objects were imported
                  into
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
