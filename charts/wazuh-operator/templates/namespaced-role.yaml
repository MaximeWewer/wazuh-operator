{{- if and (include "wazuh-operator.installOperator" .) .Values.rbac.create .Values.rbac.namespaceScoped.enabled }}
{{- $namespaces := .Values.rbac.namespaceScoped.namespaces }}
{{- $fullName := include "wazuh-operator.fullname" . }}
{{- $labels := include "wazuh-operator.labels" . }}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-manager-role
  namespace: {{ $namespace }}
  labels:
    {{- $labels | nindent 4 }}
rules:
# Core resources
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - patch
  - update
  - watch
# Apps resources
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Batch resources
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Monitoring resources
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Networking resources
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Gateway API resources
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  - tcproutes
  - udproutes
  - referencegrants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# RBAC resources (within namespace)
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Policy resources
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Wazuh and OpenSearch CRDs
- apiGroups:
  - resources.wazuh.com
  resources:
  - wazuhclusters
  - wazuhcertificates
  - wazuhdecoders
  - wazuhfilebeats
  - wazuhrules
  - wazuhmanagers
  - wazuhworkers
  - opensearchactiongroups
  - opensearchauthconfigs
  - opensearchcomponenttemplates
  - opensearchdashboards
  - opensearchindexers
  - opensearchindextemplates
  - opensearchindices
  - opensearchismpolicies
  - opensearchrolemappings
  - opensearchroles
  - opensearchsnapshotpolicies
  - opensearchtenants
  - opensearchusers
  - opensearchsnapshots
  - opensearchsnapshotrepositories
  - opensearchrestores
  - wazuhbackups
  - wazuhrestores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - resources.wazuh.com
  resources:
  - wazuhclusters/finalizers
  - wazuhcertificates/finalizers
  - wazuhdecoders/finalizers
  - wazuhfilebeats/finalizers
  - wazuhrules/finalizers
  - wazuhmanagers/finalizers
  - wazuhworkers/finalizers
  - opensearchactiongroups/finalizers
  - opensearchauthconfigs/finalizers
  - opensearchcomponenttemplates/finalizers
  - opensearchdashboards/finalizers
  - opensearchindexers/finalizers
  - opensearchindextemplates/finalizers
  - opensearchindices/finalizers
  - opensearchismpolicies/finalizers
  - opensearchrolemappings/finalizers
  - opensearchroles/finalizers
  - opensearchsnapshotpolicies/finalizers
  - opensearchtenants/finalizers
  - opensearchusers/finalizers
  - opensearchsnapshots/finalizers
  - opensearchsnapshotrepositories/finalizers
  - opensearchrestores/finalizers
  - wazuhbackups/finalizers
  - wazuhrestores/finalizers
  verbs:
  - update
- apiGroups:
  - resources.wazuh.com
  resources:
  - wazuhclusters/status
  - wazuhcertificates/status
  - wazuhdecoders/status
  - wazuhfilebeats/status
  - wazuhrules/status
  - wazuhmanagers/status
  - wazuhworkers/status
  - opensearchactiongroups/status
  - opensearchauthconfigs/status
  - opensearchcomponenttemplates/status
  - opensearchdashboards/status
  - opensearchindexers/status
  - opensearchindextemplates/status
  - opensearchindices/status
  - opensearchismpolicies/status
  - opensearchrolemappings/status
  - opensearchroles/status
  - opensearchsnapshotpolicies/status
  - opensearchtenants/status
  - opensearchusers/status
  - opensearchsnapshots/status
  - opensearchsnapshotrepositories/status
  - opensearchrestores/status
  - wazuhbackups/status
  - wazuhrestores/status
  verbs:
  - get
  - patch
  - update
{{- end }}
{{- end }}
