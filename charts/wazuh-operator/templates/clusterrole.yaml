{{- if and (include "wazuh-operator.installOperator" .) .Values.rbac.create (not .Values.operator.watchNamespaces) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "wazuh-operator.roleName" . }}
  labels:
    {{- include "wazuh-operator.labels" . | nindent 4 }}
rules:
# Core resources
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - patch
  - watch
# Storage resources
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
# Apps resources
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Batch resources
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Monitoring resources
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Networking resources
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Gateway API resources
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  - tcproutes
  - udproutes
  - referencegrants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# RBAC resources
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Policy resources
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Autoscaling resources (HPA)
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Wazuh and OpenSearch CRDs
- apiGroups:
  - resources.wazuh.com
  resources:
  - wazuhagentgroups
  - wazuhcdblists
  - wazuhclusters
  - wazuhcertificates
  - wazuhdecoders
  - wazuhfilebeats
  - wazuhintegrations
  - wazuhrules
  - wazuhroles
  - wazuhusers
  - opensearchactiongroups
  - opensearchauthconfigs
  - opensearchcomponenttemplates
  - opensearchindextemplates
  - opensearchindices
  - opensearchismpolicies
  - opensearchrolemappings
  - opensearchroles
  - opensearchsnapshotpolicies
  - opensearchtenants
  - opensearchusers
  - opensearchsnapshots
  - opensearchsnapshotrepositories
  - opensearchrestores
  - wazuhbackups
  - wazuhrestores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - resources.wazuh.com
  resources:
  - wazuhagentgroups/finalizers
  - wazuhcdblists/finalizers
  - wazuhclusters/finalizers
  - wazuhcertificates/finalizers
  - wazuhdecoders/finalizers
  - wazuhfilebeats/finalizers
  - wazuhintegrations/finalizers
  - wazuhrules/finalizers
  - wazuhroles/finalizers
  - wazuhusers/finalizers
  - opensearchactiongroups/finalizers
  - opensearchauthconfigs/finalizers
  - opensearchcomponenttemplates/finalizers
  - opensearchindextemplates/finalizers
  - opensearchindices/finalizers
  - opensearchismpolicies/finalizers
  - opensearchrolemappings/finalizers
  - opensearchroles/finalizers
  - opensearchsnapshotpolicies/finalizers
  - opensearchtenants/finalizers
  - opensearchusers/finalizers
  - opensearchsnapshots/finalizers
  - opensearchsnapshotrepositories/finalizers
  - opensearchrestores/finalizers
  - wazuhbackups/finalizers
  - wazuhrestores/finalizers
  verbs:
  - update
- apiGroups:
  - resources.wazuh.com
  resources:
  - wazuhagentgroups/status
  - wazuhcdblists/status
  - wazuhclusters/status
  - wazuhcertificates/status
  - wazuhdecoders/status
  - wazuhfilebeats/status
  - wazuhintegrations/status
  - wazuhrules/status
  - wazuhroles/status
  - wazuhusers/status
  - opensearchactiongroups/status
  - opensearchauthconfigs/status
  - opensearchcomponenttemplates/status
  - opensearchindextemplates/status
  - opensearchindices/status
  - opensearchismpolicies/status
  - opensearchrolemappings/status
  - opensearchroles/status
  - opensearchsnapshotpolicies/status
  - opensearchtenants/status
  - opensearchusers/status
  - opensearchsnapshots/status
  - opensearchsnapshotrepositories/status
  - opensearchrestores/status
  - wazuhbackups/status
  - wazuhrestores/status
  verbs:
  - get
  - patch
  - update
{{- if .Values.operator.metrics.secure }}
# Secure metrics: the controller-runtime auth filter validates and authorizes
# each scrape token via TokenReview / SubjectAccessReview.
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
{{- end }}
{{- with .Values.rbac.extraRules }}
{{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}
