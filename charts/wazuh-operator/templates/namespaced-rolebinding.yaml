{{- if and (include "wazuh-operator.installOperator" .) .Values.rbac.create .Values.rbac.namespaceScoped.enabled }}
{{- $namespaces := .Values.rbac.namespaceScoped.namespaces }}
{{- $fullName := include "wazuh-operator.fullname" . }}
{{- $labels := include "wazuh-operator.labels" . }}
{{- $operatorNamespace := include "wazuh-operator.namespace" . }}
{{- $serviceAccountName := include "wazuh-operator.serviceAccountName" . }}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-manager-rolebinding
  namespace: {{ $namespace }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ $serviceAccountName }}
  namespace: {{ $operatorNamespace }}
{{- end }}
{{- end }}
