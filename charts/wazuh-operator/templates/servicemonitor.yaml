{{- if include "wazuh-operator.createServiceMonitor" . }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "wazuh-operator.fullname" . }}
  namespace: {{ include "wazuh-operator.namespace" . }}
  labels:
    {{- include "wazuh-operator.labels" . | nindent 4 }}
    {{- with .Values.operator.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "wazuh-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
  - port: metrics
    path: /metrics
    {{- if .Values.operator.metrics.secure }}
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
    # Authenticate to the auth-protected metrics endpoint with the operator SA
    # token (RBAC in metrics-rbac.yaml). Overridable via serviceMonitor.authorization.
    authorization:
      {{- if .Values.operator.serviceMonitor.authorization }}
      {{- toYaml .Values.operator.serviceMonitor.authorization | nindent 6 }}
      {{- else }}
      type: Bearer
      credentials:
        name: {{ include "wazuh-operator.fullname" . }}-metrics-token
        key: token
      {{- end }}
    {{- end }}
    interval: {{ .Values.operator.serviceMonitor.interval | quote }}
    scrapeTimeout: {{ .Values.operator.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
