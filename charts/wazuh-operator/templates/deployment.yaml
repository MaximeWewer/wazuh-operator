{{- if include "wazuh-operator.installOperator" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wazuh-operator.fullname" . }}-controller-manager
  namespace: {{ include "wazuh-operator.namespace" . }}
  labels:
    {{- include "wazuh-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-manager
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "wazuh-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        {{- include "wazuh-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.operator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.operator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wazuh-operator.serviceAccountName" . }}
      {{- with .Values.operator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: manager
        image: {{ include "wazuh-operator.image" . }}
        imagePullPolicy: {{ include "wazuh-operator.imagePullPolicy" . }}
        command:
        - /manager
        args:
        - --health-probe-bind-address=:{{ .Values.operator.healthProbe.port }}
        {{- if .Values.operator.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.operator.metrics.port }}
        - --metrics-secure={{ .Values.operator.metrics.secure }}
        {{- else }}
        - --metrics-bind-address=0
        {{- end }}
        {{- if .Values.nonBlockingRollouts }}
        - --non-blocking-rollouts=true
        {{- else }}
        - --non-blocking-rollouts=false
        {{- end }}
        {{- if .Values.leaderElection.enabled }}
        - --leader-elect=true
        - --leader-election-id={{ .Values.leaderElection.id }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        {{- end }}
        {{- with .Values.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        {{- end }}
        env:
        {{- if .Values.webhook.enabled }}
        - name: ENABLE_WEBHOOKS
          value: "true"
        {{- else }}
        - name: ENABLE_WEBHOOKS
          value: "false"
        {{- end }}
        {{- if .Values.operator.watchNamespaces }}
        - name: WATCH_NAMESPACES
          value: {{ .Values.operator.watchNamespaces | join "," | quote }}
        {{- end }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: {{ include "wazuh-operator.operatorName" . | quote }}
        {{- if .Values.telemetry.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.telemetry.endpoint | quote }}
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: {{ .Values.telemetry.protocol | default "grpc" | quote }}
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: {{ .Values.telemetry.insecure | quote }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.telemetry.serviceName | default "wazuh-operator" | quote }}
        - name: OTEL_SERVICE_VERSION
          value: {{ .Values.telemetry.serviceVersion | default .Chart.AppVersion | quote }}
        {{- with .Values.telemetry.sampler }}
        - name: OTEL_TRACES_SAMPLER
          value: {{ . | quote }}
        {{- end }}
        - name: OTEL_TRACES_SAMPLER_ARG
          value: {{ .Values.telemetry.samplingRatio | default "1.0" | quote }}
        {{- if .Values.telemetry.headersSecret.name }}
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.telemetry.headersSecret.name }}
              key: {{ .Values.telemetry.headersSecret.key | default "headers" }}
        {{- else if .Values.telemetry.headers }}
        - name: OTEL_EXPORTER_OTLP_HEADERS
          value: {{ .Values.telemetry.headers | quote }}
        {{- end }}
        {{- if .Values.telemetry.caCert.secretName }}
        - name: OTEL_EXPORTER_OTLP_CERTIFICATE
          value: /etc/otel/ca/{{ .Values.telemetry.caCert.key | default "ca.crt" }}
        {{- end }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # k8s.* attributes (+ user-provided) reported on every span's resource.
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME){{- with .Values.telemetry.resourceAttributes }},{{ . }}{{- end }}"
        {{- end }}
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ .Values.operator.clusterDomain | default "cluster.local" | quote }}
        - name: VM_MAX_MAP_COUNT
          value: {{ .Values.operator.vmMaxMapCount | default 262144 | quote }}
        - name: GATEWAY_API_ENABLED
          value: {{ .Values.gatewayAPI.enabled | default false | quote }}
        # Logging configuration
        - name: LOG_FORMAT
          value: {{ .Values.operator.logging.format | default "json" | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.operator.logging.level | default "info" | quote }}
        # Rate limiting configuration
        {{- if .Values.operator.rateLimiting.enabled }}
        - name: RATE_LIMIT_ENABLED
          value: "true"
        - name: RATE_LIMIT_MAX_CONCURRENT
          value: {{ .Values.operator.rateLimiting.maxConcurrentReconciles | default 3 | quote }}
        - name: RATE_LIMIT_BASE_DELAY
          value: {{ .Values.operator.rateLimiting.baseDelay | default "5ms" | quote }}
        - name: RATE_LIMIT_MAX_DELAY
          value: {{ .Values.operator.rateLimiting.maxDelay | default "1000s" | quote }}
        - name: RATE_LIMIT_QPS
          value: {{ .Values.operator.rateLimiting.qps | default 10 | quote }}
        - name: RATE_LIMIT_BURST
          value: {{ .Values.operator.rateLimiting.burst | default 100 | quote }}
        {{- end }}
        {{- with .Values.operator.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.operator.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.operator.healthProbe.port }}
          initialDelaySeconds: {{ .Values.operator.healthProbe.livenessProbe.initialDelaySeconds | default 15 }}
          periodSeconds: {{ .Values.operator.healthProbe.livenessProbe.periodSeconds | default 20 }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.operator.healthProbe.port }}
          initialDelaySeconds: {{ .Values.operator.healthProbe.readinessProbe.initialDelaySeconds | default 5 }}
          periodSeconds: {{ .Values.operator.healthProbe.readinessProbe.periodSeconds | default 10 }}
        {{- with .Values.operator.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if .Values.webhook.enabled }}
        - name: webhook-cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        {{- end }}
        {{- if and .Values.telemetry.enabled .Values.telemetry.caCert.secretName }}
        - name: otel-ca
          mountPath: /etc/otel/ca
          readOnly: true
        {{- end }}
        {{- with .Values.operator.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if .Values.webhook.enabled }}
      - name: webhook-cert
        secret:
          defaultMode: 420
          secretName: {{ include "wazuh-operator.fullname" . }}-webhook-cert
      {{- end }}
      {{- if and .Values.telemetry.enabled .Values.telemetry.caCert.secretName }}
      - name: otel-ca
        secret:
          defaultMode: 420
          secretName: {{ .Values.telemetry.caCert.secretName }}
      {{- end }}
      {{- with .Values.operator.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
{{- end }}
