{{- if .Values.certManager.enabled }}
# cert-manager integration for webhook and metrics TLS certificates
#
# Prerequisites:
#   - cert-manager v1.0+ installed in the cluster
#   - cert-manager CRDs available
#
# This creates:
#   - A self-signed Issuer for the operator namespace
#   - A CA Certificate
#   - Certificates for webhooks (if enabled) and metrics
#
---
# Self-signed issuer for bootstrapping
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "wazuh-operator.fullname" . }}-selfsigned
  namespace: {{ include "wazuh-operator.namespace" . }}
  labels:
    {{- include "wazuh-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
# CA Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "wazuh-operator.fullname" . }}-ca
  namespace: {{ include "wazuh-operator.namespace" . }}
  labels:
    {{- include "wazuh-operator.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ include "wazuh-operator.fullname" . }}-ca
  secretName: {{ include "wazuh-operator.fullname" . }}-ca-secret
  duration: {{ .Values.certManager.ca.duration | default "87600h" }}  # 10 years
  renewBefore: {{ .Values.certManager.ca.renewBefore | default "2160h" }}  # 90 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "wazuh-operator.fullname" . }}-selfsigned
    kind: Issuer
    group: cert-manager.io
---
# CA Issuer using the generated CA
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "wazuh-operator.fullname" . }}-ca-issuer
  namespace: {{ include "wazuh-operator.namespace" . }}
  labels:
    {{- include "wazuh-operator.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "wazuh-operator.fullname" . }}-ca-secret
{{- if .Values.certManager.webhook.enabled }}
---
# Webhook serving certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "wazuh-operator.fullname" . }}-webhook
  namespace: {{ include "wazuh-operator.namespace" . }}
  labels:
    {{- include "wazuh-operator.labels" . | nindent 4 }}
spec:
  secretName: {{ include "wazuh-operator.fullname" . }}-webhook-cert
  duration: {{ .Values.certManager.webhook.duration | default "8760h" }}  # 1 year
  renewBefore: {{ .Values.certManager.webhook.renewBefore | default "720h" }}  # 30 days
  dnsNames:
    - {{ include "wazuh-operator.fullname" . }}-webhook-service
    - {{ include "wazuh-operator.fullname" . }}-webhook-service.{{ include "wazuh-operator.namespace" . }}
    - {{ include "wazuh-operator.fullname" . }}-webhook-service.{{ include "wazuh-operator.namespace" . }}.svc
    - {{ include "wazuh-operator.fullname" . }}-webhook-service.{{ include "wazuh-operator.namespace" . }}.svc.{{ .Values.operator.clusterDomain | default "cluster.local" }}
  issuerRef:
    name: {{ include "wazuh-operator.fullname" . }}-ca-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}
{{- if .Values.certManager.metrics.enabled }}
---
# Metrics server certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "wazuh-operator.fullname" . }}-metrics
  namespace: {{ include "wazuh-operator.namespace" . }}
  labels:
    {{- include "wazuh-operator.labels" . | nindent 4 }}
spec:
  secretName: {{ include "wazuh-operator.fullname" . }}-metrics-cert
  duration: {{ .Values.certManager.metrics.duration | default "8760h" }}
  renewBefore: {{ .Values.certManager.metrics.renewBefore | default "720h" }}
  dnsNames:
    - {{ include "wazuh-operator.fullname" . }}-metrics-service
    - {{ include "wazuh-operator.fullname" . }}-metrics-service.{{ include "wazuh-operator.namespace" . }}
    - {{ include "wazuh-operator.fullname" . }}-metrics-service.{{ include "wazuh-operator.namespace" . }}.svc
    - {{ include "wazuh-operator.fullname" . }}-metrics-service.{{ include "wazuh-operator.namespace" . }}.svc.{{ .Values.operator.clusterDomain | default "cluster.local" }}
  issuerRef:
    name: {{ include "wazuh-operator.fullname" . }}-ca-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}
{{- end }}
