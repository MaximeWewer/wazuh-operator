{{- if and (include "wazuh-operator.installOperator" .) .Values.rbac.create .Values.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "wazuh-operator.fullname" . }}-leader-election
  namespace: {{ include "wazuh-operator.namespace" . }}
  labels:
    {{- include "wazuh-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "wazuh-operator.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "wazuh-operator.serviceAccountName" . }}
  namespace: {{ include "wazuh-operator.namespace" . }}
{{- end }}
