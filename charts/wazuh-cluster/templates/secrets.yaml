{{/*
Secrets follow the naming pattern: <cluster-name>-<secret-type>
This matches the auto-generated secrets pattern used by the operator

When externalSecrets is enabled, skip creating inline secrets for components
that have external secret references configured.
*/}}

{{- $esoEnabled := and .Values.externalSecrets .Values.externalSecrets.enabled }}

{{/* Create API credentials secret only if NOT using External Secrets for wazuhApi */}}
{{- $skipApiSecret := and $esoEnabled .Values.externalSecrets.wazuhApi .Values.externalSecrets.wazuhApi.name }}
{{- if and .Values.secrets.wazuhApi .Values.secrets.wazuhApi.username .Values.secrets.wazuhApi.password (not $skipApiSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-api-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wazuh-cluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-username: {{ .Values.secrets.wazuhApi.username | quote }}
  api-password: {{ .Values.secrets.wazuhApi.password | quote }}
{{- end }}

{{/* Create indexer credentials secret only if NOT using External Secrets for indexerAdmin */}}
{{- $skipIndexerSecret := and $esoEnabled .Values.externalSecrets.indexerAdmin .Values.externalSecrets.indexerAdmin.name }}
{{- if and .Values.secrets.indexerAdmin .Values.secrets.indexerAdmin.username .Values.secrets.indexerAdmin.password (not $skipIndexerSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-indexer-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wazuh-cluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-username: {{ .Values.secrets.indexerAdmin.username | quote }}
  admin-password: {{ .Values.secrets.indexerAdmin.password | quote }}
{{- end }}

{{/* Create authd password secret only if NOT using External Secrets for wazuhAuthd */}}
{{- $skipAuthdSecret := and $esoEnabled .Values.externalSecrets.wazuhAuthd .Values.externalSecrets.wazuhAuthd.name }}
{{- if and .Values.secrets.wazuhAuthd.enabled (not $skipAuthdSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-authd-pass
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wazuh-cluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  authd.pass: {{ .Values.secrets.wazuhAuthd.password | quote }}
{{- end }}
