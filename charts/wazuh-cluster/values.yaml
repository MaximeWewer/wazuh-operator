# @section Network Policy Configuration
# Enable NetworkPolicies for Wazuh cluster components.
# See [Network Security Guide](../../docs/usage/features/network-security.md) for details.

networkPolicy:
  # -- Enable NetworkPolicies for cluster components
  enabled: false

  # -- Operator namespace (for allowing operator access)
  operatorNamespace: wazuh-system

  # @extra networkPolicy.indexer Indexer network policy settings
  indexer:
    # -- Additional ingress rules for indexer
    additionalIngress: []
    # -- Additional egress rules for indexer (e.g., for S3 backups)
    additionalEgress: []

  # @extra networkPolicy.manager Manager network policy settings
  manager:
    # -- Allow agent connections from outside the cluster
    allowAgentConnections: true
    # -- Restrict agent connections to specific CIDRs (empty = all)
    agentCIDRs: []
    additionalIngress: []
    additionalEgress: []

  # @extra networkPolicy.dashboard Dashboard network policy settings
  dashboard:
    # -- Custom ingress rules (default: allow all on port 5601)
    ingressFrom: []
    additionalEgress: []

# @section Resource Quota Configuration
# Enforce resource limits on Wazuh cluster namespace.

resourceQuota:
  # -- Enable ResourceQuota and LimitRange
  enabled: false

  # -- Maximum pods (adjust based on sizing profile: XS=10, S=15, M=25, L=40, XL=60)
  pods: "25"

  # @extra resourceQuota.requests Namespace request limits
  requests:
    # -- Total CPU requests limit
    cpu: "20"
    # -- Total memory requests limit
    memory: "40Gi"
    # -- Total storage requests limit
    storage: "500Gi"

  # @extra resourceQuota.limits Namespace limits
  limits:
    # -- Total CPU limits
    cpu: "40"
    # -- Total memory limits
    memory: "80Gi"

  # -- Maximum PVCs in namespace
  persistentvolumeclaims: "20"
  # -- Maximum ConfigMaps in namespace
  configmaps: "50"
  # -- Maximum Secrets in namespace
  secrets: "50"
  # -- Maximum Services in namespace
  services: "20"

  # @extra resourceQuota.limitRange LimitRange defaults for containers
  limitRange:
    # @extra resourceQuota.limitRange.defaultRequest Default requests if not specified
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    # @extra resourceQuota.limitRange.default Default limits if not specified
    default:
      cpu: "1"
      memory: "2Gi"
    # @extra resourceQuota.limitRange.max Maximum allowed per container
    max:
      cpu: "16"
      memory: "32Gi"
    # -- Maximum PVC size
    pvcMax: "500Gi"
    # -- Minimum PVC size
    pvcMin: "1Gi"
