    # @extra cluster.spec.dashboard OpenSearch Dashboard configuration
    # @default -- `{}` (auto-configured by sizing profile)
    dashboard:
      {}
      # replicas: 1
      # resources:
      #   requests: { cpu: "500m", memory: 1Gi }
      # hpa:
      #   enabled: true
      #   minReplicas: 2
      #   maxReplicas: 10
      #   targetCPUUtilizationPercentage: 80
      # gatewayAPI:
      #   enabled: true
