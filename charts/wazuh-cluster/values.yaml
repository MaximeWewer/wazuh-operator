# Default values for wazuh-cluster
# This chart deploys WazuhCluster CRDs and associated secrets

# @section Global Parameters

# -- Namespace where the Wazuh cluster will be deployed
namespace: wazuh

# -- Create namespace if it doesn't exist
createNamespace: true

# @section Sizing Profiles
# Select a pre-configured size profile to automatically configure resources, replicas, and storage.
# See [Sizing Guide](../../docs/usage/features/sizing.md) for full details.

sizing:
  # -- Sizing profile: XS (testing), S (dev), M (small prod), L (prod), XL (enterprise). Set to "" for custom config.
  # @default -- `"M"`
  profile: "M"

  # -- Custom storage class (applies to all profiles). Leave empty for cluster default.
  storageClassName: ""

# Profile Specifications (read-only reference):
# - XS: 1 indexer, 0 workers, ~3Gi RAM, ~15Gi storage
# - S:  1 indexer, 1 worker, ~3.5-7Gi RAM, ~40Gi storage
# - M:  3 indexers, 2 workers, ~19Gi RAM, ~210Gi storage
# - L:  3 indexers, 3 workers, ~44Gi RAM, ~500Gi storage
# - XL: 5 indexers, 5 workers, ~140Gi RAM, ~1700Gi storage

# @section Inline Secrets
# Credentials for Wazuh components. Use either inline secrets OR External Secrets (not both).

secrets:
  # @extra secrets.wazuhApi Wazuh API credentials (used by Dashboard to connect to Manager API)
  wazuhApi:
    # -- Wazuh API username
    username: "wazuh-api"
    # -- Wazuh API password (CHANGE IN PRODUCTION)
    password: "CHANGE_ME_STRONG_PASSWORD_HERE"

  # @extra secrets.indexerAdmin Indexer admin credentials (used by Dashboard and internal components)
  indexerAdmin:
    # -- Indexer admin username
    username: "admin"
    # -- Indexer admin password (CHANGE IN PRODUCTION)
    password: "CHANGE_ME_STRONG_PASSWORD_HERE"

  # @extra secrets.wazuhAuthd Wazuh authd password for agent enrollment
  wazuhAuthd:
    # -- Enable authd password secret creation
    enabled: true
    # -- Agent enrollment password (CHANGE IN PRODUCTION)
    password: "CHANGE_ME_STRONG_PASSWORD_HERE"

# @section External Secrets Operator (ESO)
# Integration with external secret providers (HashiCorp Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret Manager).
# Prerequisites: [External Secrets Operator](https://external-secrets.io) installed with SecretStore configured.

externalSecrets:
  # -- Enable External Secrets integration (when true, inline secrets are ignored for configured components)
  enabled: false

  # @extra externalSecrets.indexerAdmin Indexer admin credentials from external provider
  indexerAdmin:
    # -- ExternalSecret name (leave empty to use inline secrets)
    name: ""
    # @extra externalSecrets.indexerAdmin.secretStoreRef Reference to SecretStore or ClusterSecretStore
    secretStoreRef:
      # -- SecretStore name
      name: ""
      # -- SecretStore kind: SecretStore or ClusterSecretStore
      kind: "SecretStore"
    # @extra externalSecrets.indexerAdmin.remoteRef Remote secret location in provider
    remoteRef:
      # -- Key/path in external provider (e.g., "secret/data/wazuh/indexer")
      key: ""
    # -- Sync interval (e.g., "1h", "30m")
    refreshInterval: "1h"
    # -- Key in synced secret containing username
    usernameKey: "username"
    # -- Key in synced secret containing password
    passwordKey: "password"

  # @extra externalSecrets.wazuhApi Wazuh API credentials from external provider
  wazuhApi:
    # -- ExternalSecret name (leave empty to use inline secrets)
    name: ""
    secretStoreRef:
      name: ""
      kind: "SecretStore"
    remoteRef:
      key: ""
    refreshInterval: "1h"
    usernameKey: "username"
    passwordKey: "password"

  # @extra externalSecrets.wazuhAuthd Wazuh authd password from external provider
  wazuhAuthd:
    # -- ExternalSecret name (leave empty to use inline secrets)
    name: ""
    secretStoreRef:
      name: ""
      kind: "SecretStore"
    remoteRef:
      key: ""
    refreshInterval: "1h"
    # -- Key in synced secret containing password
    passwordKey: "password"

# @section WazuhCluster Configuration
# Main cluster configuration. One chart deploys ONE WazuhCluster.

cluster:
  # -- Enable WazuhCluster deployment
  enabled: true

  # -- Name of the WazuhCluster resource
  name: wazuh-cluster

  # @extra cluster.spec WazuhCluster CRD specification (see CRD-REFERENCE.md for all options)
  spec:
    # -- Wazuh version to deploy
    version: "4.9.0"

    # Note: If sizing.profile is set, replicas/resources/storage are auto-configured.
    # Values below are ONLY used if sizing.profile is empty ("").

    # @extra cluster.spec.indexer OpenSearch Indexer configuration
    # @default -- `{}` (auto-configured by sizing profile)
    indexer:
      {}
      # replicas: 3
      # storageSize: 50Gi
      # javaOpts: "-Xms2g -Xmx2g -Dlog4j2.formatMsgNoLookups=true"
      # resources:
      #   requests: { cpu: "2", memory: 4Gi }
      #   limits: { cpu: "4", memory: 8Gi }
      # antiAffinity:
      #   enabled: true
      #   type: required  # or "preferred"
      #   topologyKey: kubernetes.io/hostname
      # hpa:
      #   enabled: true
      #   minReplicas: 3
      #   maxReplicas: 9
      #   targetCPUUtilizationPercentage: 70
      # gatewayAPI:
      #   enabled: true
      #   gatewayRef: { name: wazuh-gateway }
      # ingress:
      #   enabled: true
      #   ingressClassName: nginx
      #   annotations:
      #     nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      #   hosts:
      #     - host: indexer.wazuh.example.com
      #       paths:
      #         - path: /
      #           pathType: Prefix
      #   tls:
      #     - secretName: indexer-tls
      #       hosts:
      #         - indexer.wazuh.example.com

    # @extra cluster.spec.manager Wazuh Manager configuration
    manager:
      # @extra cluster.spec.manager.master Master node configuration
      # @default -- `{}` (auto-configured by sizing profile)
      master:
        {}
        # storageSize: 20Gi
        # resources:
        #   requests: { cpu: "1", memory: 2Gi }
        # ingress:
        #   enabled: true
        #   ingressClassName: nginx
        #   hosts:
        #     - host: manager-master.wazuh.example.com
        #       paths:
        #         - path: /
        #           pathType: Prefix

      # @extra cluster.spec.manager.workers Worker nodes configuration
      # @default -- `{}` (auto-configured by sizing profile)
      workers:
        {}
        # replicas: 2
        # storageSize: 20Gi
        # hpa:
        #   enabled: true
        #   minReplicas: 2
        #   maxReplicas: 10
        #   targetCPUUtilizationPercentage: 80
        # gatewayAPI:
        #   enabled: true
        #   tcp: { enabled: true, enrollmentEnabled: true, eventsEnabled: true }
        # ingress:
        #   enabled: true
        #   ingressClassName: nginx
        #   hosts:
        #     - host: manager-workers.wazuh.example.com
        #       paths:
        #         - path: /
        #           pathType: Prefix

    # @extra cluster.spec.dashboard OpenSearch Dashboard configuration
    # @default -- `{}` (auto-configured by sizing profile)
    dashboard:
      {}
      # replicas: 1
      # resources:
      #   requests: { cpu: "500m", memory: 1Gi }
      # hpa:
      #   enabled: true
      #   minReplicas: 2
      #   maxReplicas: 10
      #   targetCPUUtilizationPercentage: 80
      # gatewayAPI:
      #   enabled: true
      #   hostnames: ["dashboard.wazuh.example.com"]
      # ingress:
      #   enabled: true
      #   ingressClassName: nginx
      #   hosts:
      #     - host: dashboard.wazuh.example.com
      #       paths:
      #         - path: /
      #           pathType: Prefix
      #   tls:
      #     - secretName: dashboard-tls
      #       hosts:
      #         - dashboard.wazuh.example.com

    # @extra cluster.spec.tls TLS/Certificate configuration
    # Configure TLS certificates for secure communication between components.
    tls:
      # -- Enable TLS for all components
      # @default -- `true`
      enabled: true

      # @extra cluster.spec.tls.certConfig Certificate validity and renewal settings
      certConfig:
        # -- CA certificate validity duration (e.g., "3650d" for 10 years)
        # @default -- `"3650d"`
        caValidity: "3650d"
        # -- Renew CA certificate when this much time remains before expiry
        # @default -- `"60d"`
        caRenewalThreshold: "60d"

        # -- Indexer node certificate validity duration
        # @default -- `"365d"`
        validity: "365d"
        # -- Renew indexer node certificates when this much time remains before expiry
        # @default -- `"30d"`
        renewalThreshold: "30d"

        # -- Admin certificate validity duration (used for OpenSearch security API)
        # @default -- `"365d"`
        adminValidity: "365d"
        # -- Renew admin certificates when this much time remains before expiry
        # @default -- `"30d"`
        adminRenewalThreshold: "30d"

        # -- Dashboard certificate validity duration (requires pod restart on renewal)
        # @default -- `"365d"`
        dashboardValidity: "365d"
        # -- Renew dashboard certificates when this much time remains before expiry
        # @default -- `"30d"`
        dashboardRenewalThreshold: "30d"

        # -- Filebeat certificate validity duration (requires manager pod restart on renewal)
        # @default -- `"365d"`
        filebeatValidity: "365d"
        # -- Renew filebeat certificates when this much time remains before expiry
        # @default -- `"30d"`
        filebeatRenewalThreshold: "30d"

        # -- Key algorithm: "RSA" (2048-bit) or "ECDSA" (P-256)
        # @default -- `"RSA"`
        keyAlgorithm: "RSA"
        # -- ECDSA curve (only used when keyAlgorithm is "ECDSA"): P256, P384, P521
        # @default -- `"P256"`
        ecdsaCurve: "P256"

        # @extra cluster.spec.tls.certConfig X.509 Distinguished Name fields
        # These values are used in the Subject field of generated certificates.
        # Note: CommonName (CN) is auto-generated based on certificate type:
        #   - CA: "<cluster>-ca"
        #   - Indexer: "<cluster>-indexer"
        #   - Admin: "admin" (required by OpenSearch security plugin)
        #   - Dashboard: "<cluster>-dashboard"
        #   - Filebeat: "<cluster>-filebeat"
        # -- Country code (2-letter ISO 3166-1 alpha-2)
        # @default -- `"US"`
        country: "US"
        # -- State or Province
        # @default -- `"California"`
        state: "California"
        # -- Locality (city)
        # @default -- `"San Francisco"`
        locality: "San Francisco"
        # -- Organization name
        # @default -- `"Wazuh"`
        organization: "Wazuh"
        # -- Organizational Unit
        # @default -- `"Security"`
        organizationalUnit: "Security"

      # @extra cluster.spec.tls.hotReload Hot-reload configuration for certificate renewal without restart
      # Requires Wazuh >= 4.9.0 (OpenSearch >= 2.13)
      hotReload:
        # -- Enable hot-reload of TLS certificates
        # @default -- `true`
        enabled: true
        # -- Force API reload even for versions supporting automatic reload (OpenSearch >= 2.19)
        # @default -- `false`
        forceAPIReload: false

      # @extra cluster.spec.tls.caMaintenance CA maintenance window for cluster-wide restarts
      # CA renewal requires full cluster restart. Configure maintenance windows to control when this happens.
      caMaintenance:
        # -- Allow automatic restart when CA is renewed (if false, operator waits for manual intervention)
        # @default -- `false`
        autoRestart: false
        # -- Maintenance windows when CA renewal restart is allowed (cron format)
        allowedRestartWindows: []
        # Example:
        # allowedRestartWindows:
        #   - schedule: "0 2 * * 0"  # Sundays at 2 AM
        #     duration: "4h"
        #     timezone: "UTC"

      # @extra cluster.spec.tls.customCerts Use custom certificates instead of auto-generated
      # customCerts:
      #   ca:
      #     secretName: "my-ca-secret"
      #   indexer:
      #     secretName: "my-indexer-certs"
      #   dashboard:
      #     secretName: "my-dashboard-certs"

      # @extra cluster.spec.tls.certManager Use cert-manager for certificate management
      # certManager:
      #   enabled: true
      #   issuerRef:
      #     name: "wazuh-ca-issuer"
      #     kind: "Issuer"

# @section Backup Configuration
# Configure backups for OpenSearch indices and Wazuh Manager data.
# See [Backup & Restore Guide](../../docs/usage/features/backup-restore.md) for details.

# @extra opensearchRepository OpenSearch Snapshot Repository for storing index snapshots
opensearchRepository:
  # -- Enable OpenSearchSnapshotRepository CRD creation
  enabled: false
  # name: minio-backups
  # spec:
  #   type: s3
  #   settings:
  #     bucket: wazuh-backups
  #     endpoint: http://minio.minio.svc.cluster.local:9000
  #     pathStyleAccess: true

# @extra opensearchSnapshotPolicy OpenSearch Snapshot Policy for scheduled index backups
opensearchSnapshotPolicy:
  # -- Enable OpenSearchSnapshotPolicy CRD creation
  enabled: false
  # name: daily-snapshots
  # spec:
  #   repository: { name: minio-backups }
  #   creation: { schedule: { expression: "0 2 * * *" } }

# @extra wazuhBackup Wazuh Manager Backup for scheduled manager data backups
wazuhBackup:
  # -- Enable WazuhBackup CRD creation
  enabled: false
  # name: daily-backup
  # spec:
  #   components: { agentKeys: true, fimDatabase: true }
  #   schedule: "0 2 * * *"
  #   storage: { type: s3, bucket: wazuh-backups }

# @extra backupCredentials S3/MinIO credentials secret for backups
backupCredentials:
  # -- Enable backup credentials Secret creation
  enabled: false
  # name: backup-credentials
  # accessKeyId: "minioadmin"
  # secretAccessKey: "minioadmin"

# @section Network Policy Configuration
# Enable NetworkPolicies for Wazuh cluster components.
# See [Network Security Guide](../../docs/usage/features/network-security.md) for details.

networkPolicy:
  # -- Enable NetworkPolicies for cluster components
  enabled: false

  # -- Operator namespace (for allowing operator access)
  operatorNamespace: wazuh-system

  # @extra networkPolicy.indexer Indexer network policy settings
  indexer:
    # -- Additional ingress rules for indexer
    additionalIngress: []
    # -- Additional egress rules for indexer (e.g., for S3 backups)
    additionalEgress: []

  # @extra networkPolicy.manager Manager network policy settings
  manager:
    # -- Allow agent connections from outside the cluster
    allowAgentConnections: true
    # -- Restrict agent connections to specific CIDRs (empty = all)
    agentCIDRs: []
    additionalIngress: []
    additionalEgress: []

  # @extra networkPolicy.dashboard Dashboard network policy settings
  dashboard:
    # -- Custom ingress rules (default: allow all on port 5601)
    ingressFrom: []
    additionalEgress: []

# @section Resource Quota Configuration
# Enforce resource limits on Wazuh cluster namespace.

resourceQuota:
  # -- Enable ResourceQuota and LimitRange
  enabled: false

  # -- Maximum pods (adjust based on sizing profile: XS=10, S=15, M=25, L=40, XL=60)
  pods: "25"

  # @extra resourceQuota.requests Namespace request limits
  requests:
    # -- Total CPU requests limit
    cpu: "20"
    # -- Total memory requests limit
    memory: "40Gi"
    # -- Total storage requests limit
    storage: "500Gi"

  # @extra resourceQuota.limits Namespace limits
  limits:
    # -- Total CPU limits
    cpu: "40"
    # -- Total memory limits
    memory: "80Gi"

  # -- Maximum PVCs in namespace
  persistentvolumeclaims: "20"
  # -- Maximum ConfigMaps in namespace
  configmaps: "50"
  # -- Maximum Secrets in namespace
  secrets: "50"
  # -- Maximum Services in namespace
  services: "20"

  # @extra resourceQuota.limitRange LimitRange defaults for containers
  limitRange:
    # @extra resourceQuota.limitRange.defaultRequest Default requests if not specified
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    # @extra resourceQuota.limitRange.default Default limits if not specified
    default:
      cpu: "1"
      memory: "2Gi"
    # @extra resourceQuota.limitRange.max Maximum allowed per container
    max:
      cpu: "16"
      memory: "32Gi"
    # -- Maximum PVC size
    pvcMax: "500Gi"
    # -- Minimum PVC size
    pvcMin: "1Gi"
