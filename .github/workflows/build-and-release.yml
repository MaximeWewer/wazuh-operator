name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force a specific version (optional, format: YYYY.MM.X)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wazuh-operator
  HELM_OPERATOR_CHART_PATH: charts/wazuh-operator
  HELM_CLUSTER_CHART_PATH: charts/wazuh-cluster

jobs:
  # =============================================================================
  # Job 1: Prepare Build - Extract version and validate
  # =============================================================================
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      image_name_lower: ${{ steps.lowercase.outputs.image_name_lower }}
      repository_owner_lower: ${{ steps.lowercase.outputs.repository_owner_lower }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Convert names to lowercase
        id: lowercase
        env:
          RAW_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          RAW_OWNER: ${{ github.repository_owner }}
        run: |
          echo "image_name_lower=${RAW_IMAGE_NAME,,}" >> $GITHUB_OUTPUT
          echo "repository_owner_lower=${RAW_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Generate version
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: |
          if [ "${EVENT_NAME}" == "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          elif [ -n "${FORCE_VERSION}" ]; then
            VERSION="${FORCE_VERSION#v}"
            TAG="v${VERSION}"
          else
            git fetch --tags
            YEAR_MONTH=$(date +'%Y.%-m')
            LATEST_TAG=$(git tag -l "v${YEAR_MONTH}.*" | sort -V | tail -n 1)
            if [ -z "${LATEST_TAG}" ]; then
              VERSION="${YEAR_MONTH}.1"
            else
              PATCH_VERSION="${LATEST_TAG##*.}"
              NEW_PATCH=$((PATCH_VERSION + 1))
              VERSION="${YEAR_MONTH}.${NEW_PATCH}"
            fi
            TAG="v${VERSION}"
          fi

          # Ensure semver: strip leading zeros from segments (e.g., 2026.02.1 -> 2026.2.1)
          VERSION=$(echo "${VERSION}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}')
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          if [[ "${VERSION}" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "::notice::Release version: ${VERSION} (tag: ${TAG})"

  # =============================================================================
  # Job 2: Build and Push Backup Tools Image
  # =============================================================================
  build-backup-tools:
    name: Build Backup Tools Image
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}/backup-tools
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_prerelease == 'false' }}

      - name: Build and push backup-tools image
        uses: docker/build-push-action@v7
        with:
          context: build/backup-tools
          file: build/backup-tools/Dockerfile
          push: true
          provenance: false
          cache-from: type=gha,scope=backup-tools
          cache-to: type=gha,scope=backup-tools,mode=max
          tags: ${{ steps.meta.outputs.tags }}

  # =============================================================================
  # Job 3: Build and Push Operator Docker Image
  # =============================================================================
  build-operator-image:
    name: Build Operator Image
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Wazuh Kubernetes Operator
            org.opencontainers.image.description=Kubernetes Operator for Wazuh
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/operator/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            TARGETOS=linux
            TARGETARCH=amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=operator
          cache-to: type=gha,scope=operator,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 1

  # =============================================================================
  # Job 4: Package and Push Wazuh Operator Helm Chart (OCI)
  # =============================================================================
  build-helm-operator:
    name: Package Wazuh Operator Helm Chart
    runs-on: ubuntu-latest
    needs: [prepare, build-operator-image]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'
          token: ${{ github.token }}

      - name: Log in to GitHub Container Registry
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_USER: ${{ github.actor }}
        run: |
          echo "${HELM_TOKEN}" | helm registry login "${REGISTRY}" --username "${HELM_USER}" --password-stdin

      - name: Update Chart version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" "${HELM_OPERATOR_CHART_PATH}/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" "${HELM_OPERATOR_CHART_PATH}/Chart.yaml"

          echo "Updated Chart.yaml:"
          cat "${HELM_OPERATOR_CHART_PATH}/Chart.yaml"

      - name: Lint Helm chart
        run: helm lint "${HELM_OPERATOR_CHART_PATH}"

      - name: Package Helm chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          helm package "${HELM_OPERATOR_CHART_PATH}" \
            --version "${VERSION}" \
            --app-version "${VERSION}"

      - name: Push Helm chart to OCI registry
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER_LOWER: ${{ needs.prepare.outputs.repository_owner_lower }}
        run: |
          helm push "wazuh-operator-${VERSION}.tgz" "oci://${REGISTRY}/${OWNER_LOWER}/charts"

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart-operator
          path: wazuh-operator-*.tgz
          retention-days: 1

  # =============================================================================
  # Job 5: Package and Push Wazuh Cluster Helm Chart (OCI)
  # =============================================================================
  build-helm-cluster:
    name: Package Wazuh Cluster Helm Chart
    runs-on: ubuntu-latest
    needs: [prepare, build-operator-image]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'
          token: ${{ github.token }}

      - name: Log in to GitHub Container Registry
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_USER: ${{ github.actor }}
        run: |
          echo "${HELM_TOKEN}" | helm registry login "${REGISTRY}" --username "${HELM_USER}" --password-stdin

      - name: Update Chart version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" "${HELM_CLUSTER_CHART_PATH}/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" "${HELM_CLUSTER_CHART_PATH}/Chart.yaml"

          echo "Updated Chart.yaml:"
          cat "${HELM_CLUSTER_CHART_PATH}/Chart.yaml"

      - name: Lint Helm chart
        run: helm lint "${HELM_CLUSTER_CHART_PATH}"

      - name: Package Helm chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          helm package "${HELM_CLUSTER_CHART_PATH}" \
            --version "${VERSION}" \
            --app-version "${VERSION}"

      - name: Push Helm chart to OCI registry
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER_LOWER: ${{ needs.prepare.outputs.repository_owner_lower }}
        run: |
          helm push "wazuh-cluster-${VERSION}.tgz" "oci://${REGISTRY}/${OWNER_LOWER}/charts"

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart-cluster
          path: wazuh-cluster-*.tgz
          retention-days: 1

  # =============================================================================
  # Job 6: Create GitHub Release
  # =============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-operator-image, build-helm-operator, build-helm-cluster]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Helm Operator chart
        uses: actions/download-artifact@v8
        with:
          name: helm-chart-operator
          path: helm

      - name: Download Helm Cluster chart
        uses: actions/download-artifact@v8
        with:
          name: helm-chart-cluster
          path: helm

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom

      - name: Generate release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IMAGE_LOWER: ${{ needs.prepare.outputs.image_name_lower }}
          OWNER_LOWER: ${{ needs.prepare.outputs.repository_owner_lower }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags

          PREVIOUS_TAG=$(git tag -l --sort=-version:refname | grep -v "^${TAG}$" | head -n 1)

          {
            echo "## Wazuh Operator ${VERSION}"
            echo ""
          } > release_notes.md

          if [ -n "${PREVIOUS_TAG}" ]; then
            echo "### Commits" >> release_notes.md
            echo "" >> release_notes.md
            git log "${PREVIOUS_TAG}..HEAD" --no-merges --pretty=format:"- %h %s" --max-count=5 >> release_notes.md
            echo "" >> release_notes.md

            echo "" >> release_notes.md
            echo "### Pull requests" >> release_notes.md
            echo "" >> release_notes.md
            gh pr list --repo "${REPO}" --state merged --base main --limit 5 \
              --search "merged:>=$(git log -1 --format=%aI "${PREVIOUS_TAG}")" \
              --json number,title --jq '.[] | "- #\(.number) \(.title)"' >> release_notes.md
            echo "" >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
            echo "" >> release_notes.md
          fi

          {
            echo "### Docker Images"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ${REGISTRY}/${IMAGE_LOWER}:${VERSION}"
            echo "\`\`\`"
            echo ""
            echo "### Helm Charts (OCI Registry)"
            echo ""
            echo "Due to CRD size, use \`helm template\` + \`kubectl apply\` instead of \`helm install\`:"
            echo ""
            echo "\`\`\`bash"
            echo "# Install the operator"
            echo "helm template wazuh-operator oci://${REGISTRY}/${OWNER_LOWER}/charts/wazuh-operator \\"
            echo "  --version ${VERSION} --namespace wazuh-operator | kubectl apply -f -"
            echo ""
            echo "# Install a Wazuh cluster"
            echo "helm template wazuh-cluster oci://${REGISTRY}/${OWNER_LOWER}/charts/wazuh-cluster \\"
            echo "  --version ${VERSION} | kubectl apply -f -"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo ""
            if [ -n "${PREVIOUS_TAG}" ]; then
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${TAG}"
            fi
          } >> release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          files: |
            helm/wazuh-operator-*.tgz
            helm/wazuh-cluster-*.tgz
            sbom/sbom.spdx.json
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false

      - name: Generate release summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IMAGE_LOWER: ${{ needs.prepare.outputs.image_name_lower }}
          OWNER_LOWER: ${{ needs.prepare.outputs.repository_owner_lower }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Release ${VERSION} Created Successfully"
            echo ""
            echo "### Artifacts Published"
            echo ""
            echo "#### Docker Images"
            echo "- \`${REGISTRY}/${IMAGE_LOWER}:${VERSION}\`"
            echo "- \`${REGISTRY}/${IMAGE_LOWER}:latest\`"
            echo ""
            echo "#### Helm Charts (OCI Registry)"
            echo "- Operator: \`oci://${REGISTRY}/${OWNER_LOWER}/charts/wazuh-operator:${VERSION}\`"
            echo "- Cluster: \`oci://${REGISTRY}/${OWNER_LOWER}/charts/wazuh-cluster:${VERSION}\`"
            echo ""
            echo "### Links"
            echo "- [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG})"
            echo "- [Docker Image](https://${REGISTRY}/${IMAGE_LOWER})"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Job 7: Post-Release Verification
  # =============================================================================
  verify-release:
    name: Verify Release
    runs-on: ubuntu-latest
    needs: [prepare, create-release]
    steps:
      - name: Verify Docker image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}
        run: |
          docker pull "${IMAGE}"
          docker inspect "${IMAGE}"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'
          token: ${{ github.token }}

      - name: Log in to Helm registry
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_USER: ${{ github.actor }}
        run: |
          echo "${HELM_TOKEN}" | helm registry login "${REGISTRY}" --username "${HELM_USER}" --password-stdin

      - name: Verify Helm charts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER_LOWER: ${{ needs.prepare.outputs.repository_owner_lower }}
        run: |
          helm pull "oci://${REGISTRY}/${OWNER_LOWER}/charts/wazuh-operator" --version "${VERSION}"
          helm show chart "wazuh-operator-${VERSION}.tgz"

          helm pull "oci://${REGISTRY}/${OWNER_LOWER}/charts/wazuh-cluster" --version "${VERSION}"
          helm show chart "wazuh-cluster-${VERSION}.tgz"

      - name: Verification summary
        run: |
          {
            echo "## Release Verification Completed"
            echo ""
            echo "All artifacts have been successfully verified:"
            echo "- Docker image is pullable and inspectable"
            echo "- Wazuh Operator Helm chart is available in OCI registry"
            echo "- Wazuh Cluster Helm chart is available in OCI registry"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Job 8: Cleanup untagged container images
  # =============================================================================
  cleanup:
    name: Cleanup untagged images
    needs: [prepare, verify-release]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged container images
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = '${{ needs.prepare.outputs.repository_owner_lower }}';
            const packages = [
              'wazuh-operator',
              'wazuh-operator/backup-tools',
              'charts/wazuh-operator',
              'charts/wazuh-cluster'
            ];

            for (const packageName of packages) {
              console.log(`\n--- Cleaning ${packageName} ---`);

              try {
                // Try user-owned packages first
                const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                  package_type: 'container',
                  package_name: packageName,
                  username: owner,
                  per_page: 100
                });

                console.log(`Found ${versions.data.length} versions`);
                let deletedCount = 0;

                for (const version of versions.data) {
                  const tags = version.metadata?.container?.tags || [];
                  if (tags.length === 0) {
                    console.log(`Deleting untagged version: ${version.id} (${version.name})`);
                    try {
                      await github.rest.packages.deletePackageVersionForUser({
                        package_type: 'container',
                        package_name: packageName,
                        username: owner,
                        package_version_id: version.id
                      });
                      deletedCount++;
                    } catch (deleteError) {
                      console.log(`Failed to delete version ${version.id}: ${deleteError.message}`);
                    }
                  }
                }
                console.log(`Deleted ${deletedCount} untagged versions for ${packageName}`);

              } catch (error) {
                console.log('User API failed, trying organization API...');
                try {
                  const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                    package_type: 'container',
                    package_name: packageName,
                    org: owner,
                    per_page: 100
                  });

                  console.log(`Found ${versions.data.length} versions`);
                  let deletedCount = 0;

                  for (const version of versions.data) {
                    const tags = version.metadata?.container?.tags || [];
                    if (tags.length === 0) {
                      console.log(`Deleting untagged version: ${version.id} (${version.name})`);
                      try {
                        await github.rest.packages.deletePackageVersionForOrg({
                          package_type: 'container',
                          package_name: packageName,
                          org: owner,
                          package_version_id: version.id
                        });
                        deletedCount++;
                      } catch (deleteError) {
                        console.log(`Failed to delete version ${version.id}: ${deleteError.message}`);
                      }
                    }
                  }
                  console.log(`Deleted ${deletedCount} untagged versions for ${packageName}`);

                } catch (orgError) {
                  console.log(`Both APIs failed for ${packageName}: ${orgError.message}`);
                  console.log('Skipping - package may not exist yet or insufficient permissions');
                }
              }
            }
