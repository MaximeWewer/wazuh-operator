name: Version Sync

# Weekly check for new Wazuh indexer releases. When a new Wazuh version ships and
# its matching OpenSearch prometheus-exporter plugin release exists, the
# wazuhVersionMapping table in pkg/versions/versions.go is updated and a PR opened.
#
# No cluster or container is involved: the mapping is derived from three plain
# HTTP sources (wazuh-indexer git tags, buildSrc/version.properties, and the
# opensearch-prometheus-exporter releases). See hack/version-sync for details.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    name: Sync Wazuh version mapping
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Update version mapping
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./hack/version-sync -file pkg/versions/versions.go

      - name: Format and validate
        run: |
          gofmt -w pkg/versions/versions.go
          go build ./...
          go test ./pkg/versions/...

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- pkg/versions/versions.go; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::wazuhVersionMapping already up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/version-sync
          delete-branch: true
          commit-message: "chore(versions): sync wazuhVersionMapping with upstream releases"
          title: "chore(versions): sync Wazuh version mapping"
          body: |
            Automated update of `wazuhVersionMapping` in `pkg/versions/versions.go`.

            New rows were added for Wazuh versions whose pinned OpenSearch version
            (from `buildSrc/version.properties`) has a matching
            `opensearch-prometheus-exporter` plugin release.

            Generated by `.github/workflows/version-sync.yml` (`hack/version-sync`).
            Please review the OpenSearch version jumps before merging.
